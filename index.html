<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>宝宝乐园</title>
<meta name="apple-mobile-web-app-title" content="宝宝乐园">
<meta name="theme-color" content="#FFD1DC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--tabH:clamp(38px,6.5vh,50px);--ink:#5B4A55;--top:clamp(54px,9vh,74px);--tray:clamp(104px,19vh,150px)}
@media (max-height:520px){:root{--top:46px;--tray:92px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#FFF4EA;color:var(--ink);
  font-family:"PingFang SC","Hiragino Maru Gothic ProN","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;touch-action:manipulation}
button{font-family:inherit;color:var(--ink)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* 顶部：房间 */
#top{height:var(--top);flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:#FFF7EF;border-bottom:3px solid var(--ink);z-index:3}
#rooms{display:flex;gap:8px;flex:1;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px}
#rooms::-webkit-scrollbar{display:none}
.room-btn{flex:none;display:flex;align-items:center;gap:6px;height:calc(var(--top) - 18px);padding:0 16px 0 8px;border-radius:999px;
  border:3px solid var(--ink);background:#fff;font-size:clamp(13px,2.3vh,17px);font-weight:800;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .15s,box-shadow .15s,background .2s}
.room-btn .ic{font-size:1.45em;line-height:1}
.room-btn.on{background:var(--c);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tools{display:flex;gap:6px;flex:none}
.tool{width:calc(var(--top) - 18px);height:calc(var(--top) - 18px);border-radius:50%;border:3px solid var(--ink);background:#fff;
  font-size:clamp(16px,2.6vh,22px);cursor:pointer;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
@media (max-width:640px){.room-btn b{display:none}.room-btn{padding:0 8px}}

/* 舞台 */
#stageWrap{flex:1;position:relative;min-height:0;overflow:hidden}
#stage{position:absolute;left:0;right:0;top:0;bottom:var(--tabH);width:100%;height:calc(100% - var(--tabH));display:block;touch-action:none}
#app.trayHidden #stage{bottom:var(--tabH)}
#stage *, .card svg *{transform-origin:0 0}
#nightL,#lightL,#fxL{pointer-events:none}
#lightL{mix-blend-mode:screen;transition:opacity .4s}

/* 选中后的工具条 */
#toolbar{position:absolute;display:none;gap:6px;padding:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;
  box-shadow:0 4px 0 var(--ink);z-index:5}
#toolbar.show{display:flex;animation:tbIn .2s ease-out}
@keyframes tbIn{from{transform:scale(.6);opacity:0}}
#toolbar button{width:clamp(38px,6.2vh,50px);height:clamp(38px,6.2vh,50px);border-radius:50%;border:none;background:#FFF1F5;
  font-size:clamp(17px,2.9vh,24px);cursor:pointer;display:grid;place-items:center;padding:0}
#toolbar button:active{transform:scale(.9)}
#toolbar button[data-act=del]{background:#FFE3E3}

/* 底部抽屉 */
#tray{height:var(--tray);flex:none;position:relative;background:var(--c,#fff);border-top:3px solid var(--ink);z-index:4;transition:height .25s}
#app.trayHidden #tray{height:0;border-top-width:3px}
#tabs{position:absolute;bottom:100%;left:10px;display:flex;gap:6px;margin-bottom:-3px}
.tab{height:clamp(38px,6.5vh,50px);min-width:clamp(46px,7vh,58px);padding:0 10px;border:3px solid var(--ink);border-bottom:none;border-radius:16px 16px 0 0;
  background:var(--c);display:flex;align-items:center;gap:4px;font-size:clamp(13px,2vh,15px);font-weight:800;cursor:pointer;
  transform:translateY(6px);transition:transform .15s;opacity:.85}
.tab span{font-size:1.5em;line-height:1}
.tab.on{transform:translateY(0);opacity:1;height:calc(clamp(38px,6.5vh,50px) + 3px)}
.tab.fold{background:#fff;min-width:44px;font-size:16px}
@media (max-width:760px),(max-height:520px){.tab b{display:none}}
#cards{position:absolute;inset:0;display:flex;gap:10px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:thin}
#app.trayHidden #cards{display:none}
.card{flex:none;height:100%;aspect-ratio:.9;background:#fff;border:3px solid var(--ink);border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4px 4px 2px;cursor:grab;box-shadow:0 4px 0 rgba(91,74,85,.35);transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card.press{transform:scale(.93)}
.card svg{width:100%;flex:1;min-height:0;pointer-events:none}
.card span{font-size:clamp(11px,1.8vh,14px);font-weight:800;line-height:1.3;white-space:nowrap}

#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:20px;
  padding:8px 16px;font-weight:800;font-size:clamp(14px,2.4vh,18px);pointer-events:none;animation:hintBob 1.2s ease-in-out infinite;white-space:nowrap;z-index:2}
@keyframes hintBob{50%{transform:translateX(-50%) translateY(-6px)}}
#rotate{position:fixed;inset:0;background:rgba(255,244,234,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;font-weight:800;font-size:20px}
#rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px) and (pointer:coarse){#rotate.ask{display:flex}}

/* ---------- 场景动画 ---------- */
.idle{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.blink{animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.appear{animation:appear .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes appear{from{transform:scale(0)}to{transform:scale(1)}}
.jump{animation:jump .65s ease-out}
@keyframes jump{0%{transform:scale(1.15,.82)}35%{transform:translateY(-75px) scale(.92,1.1)}65%{transform:translateY(0) scale(1.12,.88)}82%{transform:scale(.96,1.04)}100%{transform:none}}
.hop{animation:hop .5s ease-out}
@keyframes hop{0%{transform:scale(1.1,.9)}40%{transform:translateY(-32px) scale(.96,1.05)}75%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.wiggle{animation:wiggle .55s ease-in-out}
@keyframes wiggle{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.m-swing{animation:swing 1.7s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.m-slide{animation:slideA 3.8s infinite}
@keyframes slideA{
  0%,22%{transform:translate(0,0);opacity:1;animation-timing-function:ease-in}
  55%{transform:translate(var(--dx),var(--dy));animation-timing-function:ease-out}
  64%,80%{transform:translate(var(--ex),var(--ey));opacity:1}
  87%{transform:translate(var(--ex),var(--ey));opacity:0}
  88%{transform:translate(0,0);opacity:0}
  96%,100%{transform:translate(0,0);opacity:1}}
.m-bounce{animation:bounceA 1.1s infinite}
@keyframes bounceA{
  0%{transform:translateY(0) scale(1.15,.85);animation-timing-function:ease-out}
  14%{transform:translateY(0) scale(.95,1.06);animation-timing-function:ease-out}
  50%{transform:translateY(var(--h)) scale(1,1);animation-timing-function:ease-in}
  90%{transform:translateY(0) scale(.97,1.03)}
  100%{transform:translateY(0) scale(1.15,.85)}}
.m-bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(6px) rotate(3deg)}}
.m-nod{animation:nod .9s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg) translateY(4px)}}
.zzz text{animation:zz 2.4s ease-out infinite;opacity:0}
.zzz .z2{animation-delay:.8s}.zzz .z3{animation-delay:1.6s}
@keyframes zz{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(34px,-70px) scale(1.2);opacity:0}}
.flame{animation:flicker .28s ease-in-out infinite alternate}
@keyframes flicker{to{transform:scale(.82,1.15)}}
.steam{animation:steam 2.4s ease-in-out infinite;opacity:0}
@keyframes steam{0%{transform:translateY(10px);opacity:0}30%{opacity:.9}100%{transform:translateY(-44px);opacity:0}}
.bub{animation:bub 3s ease-in infinite;opacity:0}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
.bobB{animation:bobB 3s ease-in-out infinite}
@keyframes bobB{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-8px)}}
.spin{animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hand-m{animation:spin 10s linear infinite}.hand-h{animation:spin 120s linear infinite}
.drift{animation:drift 90s linear infinite}
@keyframes drift{from{transform:translateX(-400px)}to{transform:translateX(2000px)}}
.twinkle{animation:twinkle 2s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.3}}
.fxp{animation:fxp 1.2s ease-out both}
@keyframes fxp{0%{transform:translate(0,0) scale(.2);opacity:1}25%{transform:translate(calc(var(--dx)*.3),calc(var(--dy)*.4)) scale(1.1)}100%{transform:translate(var(--dx),var(--dy)) scale(.7);opacity:0}}
.emote{animation:emote 1.9s ease-out both}
@keyframes emote{0%{transform:translateY(10px) scale(0);opacity:0}15%{transform:translateY(0) scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.pulse{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
/* 手机横屏：左边房间栏 + 中间场景 + 右边道具栏，高度全给场景 */
@media (max-height:560px) and (min-aspect-ratio:3/2){
  #app{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:100%}
  #top{height:auto;flex-direction:column;justify-content:flex-start;padding:6px 5px;gap:6px;border-bottom:none;border-right:3px solid var(--ink);overflow-y:auto;scrollbar-width:none}
  #top::-webkit-scrollbar{display:none}
  #rooms{flex:none;flex-direction:column;overflow:visible;padding:0 0 3px;gap:6px}
  .room-btn{width:46px;height:44px;padding:0;justify-content:center;border-radius:16px;box-shadow:0 3px 0 var(--ink)}
  .room-btn b{display:none}
  .room-btn .ic{font-size:24px}
  .tools{flex-direction:column;gap:6px;margin-top:4px}
  .tool{width:46px;height:38px;border-radius:14px}
  #stage,#app.trayHidden #stage{bottom:0;height:100%}
  #tray,#app.trayHidden #tray{height:auto;display:flex;border-top:none;border-left:3px solid var(--ink)}
  #tabs{position:static;flex-direction:column;margin:0;padding:6px 0 6px 6px;gap:5px;background:#FFF7EF;overflow-y:auto;scrollbar-width:none}
  .tab,.tab.on{height:44px;min-width:0;width:48px;padding:0;justify-content:center;border:3px solid var(--ink);border-right:none;border-radius:14px 0 0 14px}
  .tab{transform:translateX(6px)}
  .tab.on{transform:none}
  .tab.fold{transform:none;border-right:3px solid var(--ink);border-radius:14px;width:44px;margin-top:auto;flex:none}
  #cards{position:static;flex-direction:column;width:104px;padding:8px;gap:8px;overflow-x:hidden;overflow-y:auto;touch-action:pan-y}
  .card{flex:none;height:86px;width:100%;aspect-ratio:auto}
  .card:hover{transform:none}
  #hint{font-size:14px;padding:6px 12px;top:auto;bottom:10px}
}
/* ---------- 故事 / 相册 ---------- */
[hidden]{display:none!important}
.tool.story{width:auto;padding:0 14px 0 10px;border-radius:999px;background:#FFE07A;display:flex;gap:4px;align-items:center;flex:none;font-size:clamp(18px,2.8vh,24px)}
.tool.story b{font-size:clamp(13px,2.2vh,17px)}
.tool.off{opacity:.45}
.tool.bump{animation:bump .5s ease-out}
@keyframes bump{30%{transform:scale(1.3) rotate(-8deg)}}
@media (max-width:1100px){.room-btn b{display:none}.room-btn{padding:0 10px}}
.storyOn #rooms{pointer-events:none;opacity:.4}
#rooms{min-width:0}
.more-wrap{position:relative;flex:none}
#more{position:absolute;top:calc(100% + 10px);right:0;display:flex;gap:6px;padding:8px;background:#fff;border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 4px 0 var(--ink);z-index:40;animation:tbIn .2s ease-out}
.storyOn #bStory,.storyOn #bReset{display:none}
#storyBar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);
  border-radius:999px;padding:6px 8px;box-shadow:0 4px 0 var(--ink);z-index:6;max-width:calc(100% - 16px)}
.sb-btn{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:#FFE07A;font-size:24px;flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
#sbSay.talking{animation:talk .45s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.12)}}
#sbExit{background:#fff;width:40px;height:40px;font-size:16px}
#sbPic{display:flex;align-items:center;gap:2px;height:60px}
#sbPic svg{height:60px;width:58px}
.ar{font-size:26px;font-weight:900;line-height:1}.ar.big{font-size:40px}
.sb-side{display:flex;flex-direction:column;gap:4px;min-width:0}
#sbDots{display:flex;gap:4px}
#sbDots i{width:9px;height:9px;border-radius:50%;background:#EADCE2}
#sbDots i.on{background:#FF8FB1}
#sbText{font-size:12px;opacity:.6;max-width:210px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hand{position:fixed;left:0;top:0;font-size:52px;line-height:1;pointer-events:none;z-index:30;display:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));transform-origin:20px 6px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(91,74,85,.5);display:flex;align-items:center;justify-content:center;z-index:25;padding:10px}
.ov-box{position:relative;background:#FFF7EF;border:4px solid var(--ink);border-radius:28px;padding:12px 14px 16px;width:min(900px,96vw);max-height:94vh;overflow:auto;animation:tbIn .25s ease-out}
.ov-head{display:flex;justify-content:space-between;align-items:center;font-size:34px;margin-bottom:8px}
.ov-x{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:18px;cursor:pointer}
#smCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sm-card{background:var(--c);border:3px solid var(--ink);border-radius:22px;padding:8px 6px 10px;cursor:pointer;box-shadow:0 5px 0 var(--ink);position:relative;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;color:var(--ink)}
.sm-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.sm-card .pics{display:flex;align-items:center;height:96px}
.sm-card svg{height:96px;width:80px}
.sm-card b{font-size:15px}
.sm-card .st{position:absolute;top:-12px;right:-8px;font-size:32px}
.rw-box{width:auto;min-width:300px;text-align:center}
.rw-star{font-size:110px;line-height:1.1;animation:star 1.2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes star{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
#rwStars{font-size:30px;letter-spacing:4px;margin:6px 0 14px}
#rwStars span{filter:grayscale(1);opacity:.3}#rwStars span.got{filter:none;opacity:1}
.rw-btns,.av-btns{display:flex;gap:16px;justify-content:center}
.rw-btns button,.av-btns button{width:76px;height:76px;border-radius:24px;border:3px solid var(--ink);background:#fff;font-size:34px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.av-btns button.big{width:110px;background:#FFE07A}
.rw-btns button:active,.av-btns button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
#alCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.al-card{position:relative;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:5px;cursor:pointer;box-shadow:0 4px 0 var(--ink);aspect-ratio:16/9.6}
.al-card img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.al-card span{position:absolute;left:8px;bottom:6px;font-size:18px;background:#fff;border-radius:10px;padding:0 4px}
.al-new{font-size:40px;background:#FFF1F5}
#albumView{position:absolute;inset:0;background:#FFF7EF;border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#avImg{max-width:100%;max-height:calc(100% - 100px);border:4px solid var(--ink);border-radius:16px;background:#fff}
@media (max-height:560px) and (min-aspect-ratio:3/2){
  .tool.story{width:46px;height:44px;padding:0;justify-content:center;border-radius:16px;flex:none}
  .tool.story b{display:none}
  .tools{position:fixed;top:6px;right:170px;flex-direction:row;margin:0;z-index:8;gap:5px}
  #app.trayHidden .tools{right:66px}
  .tools .tool{width:40px;height:38px;border-radius:14px;font-size:18px}
  .storyOn #bPhoto,.storyOn #bAlbum{display:none}
  #storyBar{top:4px;gap:6px;padding:4px 6px}
  .sb-btn{width:42px;height:42px;font-size:20px}
  #sbPic,#sbPic svg{height:44px}#sbPic svg{width:44px}
  #sbText{display:none}
  .ov-box{padding:8px 10px 10px}
  .sm-card .pics,.sm-card svg{height:70px}.sm-card svg{width:60px}
  #smCards{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .rw-star{font-size:70px}
  .rw-btns button,.av-btns button{width:60px;height:60px;font-size:28px}
}
/* ---------- 走路、木马、小工具条 ---------- */
.walk{animation:waddle .4s ease-in-out infinite alternate}
@keyframes waddle{from{transform:rotate(-6deg)}to{transform:rotate(6deg) translateY(-5px)}}
.hopwalk{animation:hopw .42s ease-in-out infinite}
@keyframes hopw{0%,100%{transform:translateY(0) scale(1.06,.94)}50%{transform:translateY(-24px) scale(.95,1.06)}}
.m-rock{animation:rock 1.4s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
#toolbar{gap:4px;padding:4px;border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
#toolbar button{width:clamp(32px,5vh,40px);height:clamp(32px,5vh,40px);font-size:clamp(15px,2.4vh,19px)}
/* ---------- 星星 / 英语按钮 ---------- */
.tool.eng{background:#BFE6FF}
.tool.coin{width:auto;padding:0 12px;border-radius:999px;background:#FFF3C4;font-weight:900;display:flex;gap:3px;align-items:center;font-size:clamp(15px,2.4vh,19px)}
.flystar{position:fixed;font-size:34px;z-index:60;pointer-events:none;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.5,0,.6,1),top .9s cubic-bezier(.3,-.4,.7,1),transform .9s}
.card{position:relative}
.card.locked svg{filter:grayscale(.7) brightness(.95);opacity:.55}
.card .lock{position:absolute;top:4px;right:4px;font-style:normal;font-size:12px;font-weight:900;background:#FFF3C4;border:2px solid var(--ink);border-radius:999px;padding:0 5px;line-height:18px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#shopCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.sh-card{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:6px;cursor:pointer;box-shadow:0 4px 0 var(--ink);height:140px;display:flex;flex-direction:column;align-items:center;font-family:inherit;color:var(--ink)}
.sh-card svg{flex:1;min-height:0;width:100%}
.sh-card:not(.got) svg{filter:grayscale(.6);opacity:.6}
.sh-card .price{font-weight:900;font-size:17px;background:#FFF3C4;border-radius:999px;padding:0 10px;border:2px solid var(--ink)}
.sh-card.got{background:#F1FFF1}
.sh-card.focus{outline:5px solid #FF8FB1}

<script>
/* ================= 基础工具 ================= */
const SVGNS='http://www.w3.org/2000/svg';
const O='#5B4A55', NS='stroke="none"', FL=480;
const $=s=>document.querySelector(s);
const r1=v=>Math.round(v*10)/10, r3=v=>Math.round(v*1000)/1000;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)};
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=p<0?0:255,a=Math.abs(p);
  r=Math.round((t-r)*a+r);g=Math.round((t-g)*a+g);b=Math.round((t-b)*a+b);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
const E=(cx,cy,rx,ry,f,e='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${e}/>`;
const C=(cx,cy,r,f,e='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${e}/>`;
const R=(x,y,w,h,rx,f,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${e}/>`;
const P=(d,f,e='')=>`<path d="${d}" fill="${f}" ${e}/>`;
const L=(d,w=4,c=O,e='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" ${e}/>`;
const tube=(d,c,w)=>L(d,w+8)+L(d,w,c);
const blob=(cs,f)=>cs.map(([x,y,r])=>C(x,y,r,O,'stroke-width="8"')).join('')+cs.map(([x,y,r])=>C(x,y,r,f,NS)).join('');
const heartD=(cx,cy,r)=>`M ${cx} ${cy+r*.9} C ${cx-r*1.7} ${cy-r*.1} ${cx-r*.9} ${cy-r*1.4} ${cx} ${cy-r*.45} C ${cx+r*.9} ${cy-r*1.4} ${cx+r*1.7} ${cy-r*.1} ${cx} ${cy+r*.9} Z`;
function starD(cx,cy,r){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.47:r;d+=(i?'L':'M')+r1(cx+Math.cos(a)*rr)+' '+r1(cy+Math.sin(a)*rr)+' ';}return d+'Z';}
function flower(x,y,r,c){let s='';for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;s+=C(r1(x+Math.cos(a)*r*.8),r1(y+Math.sin(a)*r*.8),r*.62,c,'stroke-width="2.5"');}return s+C(x,y,r*.5,'#FFE07A','stroke-width="2.5"');}
const cloudNS=(x,y,k,f='#fff')=>C(x-30*k,y,22*k,f,NS)+C(x,y-14*k,30*k,f,NS)+C(x+32*k,y,22*k,f,NS)+R(x-52*k,y-4*k,104*k,26*k,13*k,f,NS);

/* ================= 小动物 ================= */
const mw=y=>L(`M -8 ${y} Q -4 ${y+6} 0 ${y} Q 4 ${y+6} 8 ${y}`,3.5);
const AN={

function syn({type='sine',pts,dur,vol=.14,delay=0,filter,vib,trem}){
  if(!state.sound||!AC)return;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(pts[0][1],t);for(const [dt,f] of pts.slice(1))o.frequency.linearRampToValueAtTime(f,t+dt);
  let node=o;
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=vib[0];lg.gain.value=vib[1];l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+dur+.05);}
  if(filter){const f=AC.createBiquadFilter();f.type=filter[0];f.frequency.value=filter[1];f.Q.value=filter[2]||1;node.connect(f);node=f;}
  if(trem){const tg=AC.createGain();tg.gain.value=1-trem[1]/2;const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=trem[0];lg.gain.value=trem[1]/2;
    l.connect(lg).connect(tg.gain);l.start(t);l.stop(t+dur+.05);node.connect(tg);node=tg;}
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

function compile(S){
  if(S.ev)return S;
  const ev=[],pk=S.pickup||0;let b=0;
  for(const tok of S.mel.split(/\s+/)){if(!tok||tok==='|')continue;const [n,d]=tok.split(':'),du=d?+d:1;if(n!=='R')ev.push({b,f:hz(n),d:du,k:'mel'});b+=du;}
  S.ch.split(/\s+/).forEach((c,i)=>{
    const s0=pk+i*S.bar,ns=CHORD[c].map(hz);
    if(S.style==='waltz'){ev.push({b:s0,f:ns[0],d:2,k:'bass'});for(const j of[1,2])for(const n of[ns[1],ns[2]])ev.push({b:s0+j,f:n*2,d:.8,k:'ch'});}
    else if(S.style==='bounce'){ev.push({b:s0,f:ns[0],d:1,k:'bass'},{b:s0+2,f:ns[2],d:1,k:'bass'});for(const j of[1,3])for(const n of[ns[1],ns[2]])ev.push({b:s0+j,f:n*2,d:.5,k:'ch'});}
    else{ev.push({b:s0,f:ns[0],d:2,k:'bass'});[0,1,2,1,0,1,2,1].forEach((x,j)=>ev.push({b:s0+j*.5,f:ns[x]*4,d:.5,k:'arp'}));}
  });
  ev.sort((a,b)=>a.b-b.b);S.ev=ev;S.len=Math.max(b,pk+S.ch.split(/\s+/).length*S.bar);return S;
}
function playNote(inst,f,t,dur,vol,dest){
  const g=AC.createGain();g.connect(dest||BUS.mus);
  const parts=inst==='box'?[[f,'sine',1],[f*4,'sine',.15]]:inst==='xylo'?[[f,'sine',1],[f*4,'sine',.22]]
    :inst==='bell'?[[f,'triangle',.8],[f*2.76,'sine',.12]]:[[f,inst==='bass'?'triangle':'sine',1]];
  const dec=inst==='box'?1.4:inst==='xylo'?.5:inst==='bell'?1.1:Math.max(.35,dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  for(const [fr,ty,a] of parts){const o=AC.createOscillator(),og=AC.createGain();o.type=ty;o.frequency.value=fr;og.gain.value=a;o.connect(og).connect(g);o.start(t);o.stop(t+dec+.05);}
}
const MUS={id:null,S:null,t0:0,i:0,timer:null,onEnd:null};
let songLock=false;
function musicPlay(id,onEnd){
  if(!AC)return;
  if(MUS.id===id&&!onEnd)return;
  MUS.id=id;MUS.S=compile(SONGS[id]);MUS.i=0;MUS.t0=AC.currentTime+.15;MUS.onEnd=onEnd||null;
  clearInterval(MUS.timer);MUS.timer=setInterval(musTick,50);musTick();
}
function musTick(){
  const S=MUS.S;if(!S||!AC||AC.state!=='running')return;
  const spb=60/S.bpm,hor=AC.currentTime+.3;
  while(true){
    if(MUS.i>=S.ev.length){
      if(S.once){clearInterval(MUS.timer);MUS.timer=null;const cb=MUS.onEnd;MUS.onEnd=null;
        setTimeout(()=>cb&&cb(),Math.max(0,(MUS.t0+S.len*spb-AC.currentTime)*1000)+400);return;}
      MUS.t0+=S.len*spb;MUS.i=0;
    }
    const e=S.ev[MUS.i],t=MUS.t0+e.b*spb;if(t>hor)break;
    if(t>AC.currentTime-.05&&(state.music!==false||S.once))
      playNote(e.k==='mel'?S.inst:e.k==='arp'?'bell':e.k==='bass'?'bass':'pad',e.f,t,e.d*spb,{mel:.22,bass:.15,ch:.05,arp:.045}[e.k]);
    MUS.i++;
  }
}
const SONG_OF={soccer:'sport',basket:'sport',school:'school',classroom:'school',pretend:'kitchen',maze:'play',hide:'living'};
function musicUpdate(){if(!AC||!welcomed||songLock)return;const id=state.night?'night':(SONG_OF[state.room]||state.room);musicPlay(SONGS[id]?id:'living');}
function playSongOnce(id){return new Promise(res=>{if(!AC){res();return;}songLock=true;duck(false,true);
  musicPlay(id,()=>{songLock=false;MUS.id=null;musicUpdate();res();});});}
function duck(on,force){
  if(!BUS)return;
  const base=(state.music===false&&!force&&!songLock)?0:.5;
  BUS.mus.gain.setTargetAtTime(on?base*.25:base,AC.currentTime,.12);
}

function setTalking(on){$('#sbSay').classList.toggle('talking',!!on);}
function stopVO(){
  VOX.tok++;VOX.story=false;
  if(VOX.el){VOX.el.onended=VOX.el.onerror=null;VOX.el.pause();VOX.el=null;}
  try{speechSynthesis.cancel();}catch(e){}
  if(VOX.res){const r=VOX.res;VOX.res=null;r();}
  duck(false);setTalking(false);
}
function playOne(id,tok){return new Promise(res=>{
  if(!state.sound||tok!==VOX.tok){res();return;}
  let fin=false;const done=()=>{if(fin)return;fin=true;if(VOX.res===done)VOX.res=null;res();};
  VOX.res=done;
  const a=new Audio('voice/'+id+'.mp3');VOX.el=a;
  let fell=false;const fallback=()=>{if(fell||fin)return;fell=true;if(tok!==VOX.tok||!VO[id])return done();
    try{const u=new SpeechSynthesisUtterance(VO[id]);u.lang='zh-CN';u.rate=.95;u.pitch=1.15;u.onend=u.onerror=done;speechSynthesis.speak(u);setTimeout(done,6000);}catch(e){done();}};
  a.onended=done;a.onerror=fallback;
  const p=a.play();if(p&&p.catch)p.catch(fallback);
});}
async function say(ids,{story:isStory=false}={}){
  stopVO();const tok=VOX.tok;VOX.story=isStory;duck(true);setTalking(isStory);
  for(const id of ids){if(tok!==VOX.tok)return false;await playOne(id,tok);if(tok===VOX.tok&&ids.length>1)await sleep(120);}
  if(tok!==VOX.tok)return false;
  VOX.story=false;duck(false);setTalking(false);return true;
}

function taskDone(t){
  if(!t)return true;
  if(t.night!=null)return state.night===t.night;
  if(t.seat)return sItems().some(i=>i.t===t.seat[0]&&i.h&&(getItem(i.h)||{}).t===t.seat[1]);
  if(t.acc)return sItems().some(i=>i.t===t.acc[0]&&i.acc&&Object.values(i.acc).includes(t.acc[1]));
  if(t.off)return sItems().some(i=>i.t===t.off)&&sItems().filter(i=>i.t===t.off).every(i=>!i.o);
  if(t.open)return sItems().some(i=>i.t===t.open&&i.o);
  if(t.tapped)return !!story&&story.tapped.has(t.tapped);
  return false;
}

  if(!story)return false;

async function runStory(st){
  const tok=story.tok,alive=()=>story&&story.tok===tok;
  showStep(st,{say:[st.t],pic:st.cover},-1);
  await say([st.t],{story:true});if(!alive())return;await sleep(400);
  for(let i=0;i<st.steps.length;i++){
    if(!alive())return;
    const s=st.steps[i];story.i=i;story.tapped=new Set();showStep(st,s,i);
    if(s.find){await runFind(s.find,alive);if(!alive())return;continue;}
    if(s.pre&&MODE_SND[s.pre])MODE_SND[s.pre]();
    if(s.say){await say(s.say,{story:true});if(!alive())return;}
    if(s.song){if(s.confetti)celebrate();await playSongOnce(s.song);if(!alive())return;}
    if(s.task){
      if(!taskDone(s.task)){
        guide(s.guide,s.task);
        await waitTask(s.task,s.say);
        clearInterval(story&&story.idle);guide(null);if(!alive())return;
      }
      await sleep(250);await praise();if(!alive())return;
    }

/* ---------- 小手指引：从哪儿拖到哪儿 ---------- */
const HAND={el:$('#hand'),g:null,t0:0,raf:0};
function guide(g,task){
  HAND.g=g?{...g,task}:null;HAND.t0=performance.now();HAND.el.style.display=g?'block':'none';
  if(g&&!HAND.raf)HAND.raf=requestAnimationFrame(handTick);
}
function firstOf(t,pred=()=>true){return sItems().find(i=>i.t===t&&pred(i));}
function ptOfItem(it,f){const L=layout[it.id];if(!L)return null;const b=boxOf(it),m=stage.getScreenCTM();
  return {x:m.a*L.x+m.e,y:m.d*(L.y+(b[1]+b[3]*f)*L.S)+m.f};}
function resolvePt(spec,task){
  if(!spec)return null;
  if(spec[0]==='#'){const e=$(spec);if(!e)return null;const r=e.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}
  const [k,a,b]=spec.split(':');
  if(k==='a'||k==='t'){
    let it=null;
    if(task&&task.seat&&task.seat[0]===a)it=firstOf(a,i=>!(i.h&&(getItem(i.h)||{}).t===task.seat[1]));
    it=it||firstOf(a);return it&&ptOfItem(it,k==='a'?.42:.45);
  }
  if(k==='seat'){
    for(const h of sItems().filter(i=>i.t===a)){const d=def(h);
      for(let i=0;i<d.seats.length;i++)if(!sItems().some(o=>o.h===h.id&&o.si===i)){
        const p=seatPos(h,i),m=stage.getScreenCTM();return {x:m.a*p.x+m.e,y:m.d*(p.y-40*p.S)+m.f};}}
    return null;
  }
  if(k==='card'){
    if(state.cat!==a||state.trayHidden){state.cat=a;state.trayHidden=false;renderTray();}
    const c=document.querySelector(`.card[data-key="${b}"]`);if(!c)return null;
    const cr=$('#cards').getBoundingClientRect();let r=c.getBoundingClientRect();
    if(r.left<cr.left-2||r.right>cr.right+2||r.top<cr.top-2||r.bottom>cr.bottom+2){c.scrollIntoView({block:'nearest',inline:'nearest'});r=c.getBoundingClientRect();}
    return {x:r.left+r.width/2,y:r.top+r.height/2};
  }
  return null;
}
function handTick(now){
  HAND.raf=0;const g=HAND.g;if(!g)return;
  const a=resolvePt(g.tap||g.from,g.task),b=g.tap?a:resolvePt(g.to,g.task);
  if(a&&b&&!drag){
    if(story)story.lastPt=svgPtFromScreen(b);
    const T=g.tap?1100:2400,p=((now-HAND.t0)%T)/T;let x,y,s=1,o=1;
    if(g.tap){x=a.x;y=a.y+(p>.3&&p<.5?6:0);s=p>.3&&p<.5?.85:1;}
    else{const e=p<.15?0:p>.75?1:(p-.15)/.6,ee=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2;
      x=a.x+(b.x-a.x)*ee;y=a.y+(b.y-a.y)*ee;s=(p<.15||(p>.75&&p<.9))?.85:1;o=p>.9?Math.max(0,1-(p-.9)*10):p<.05?p*20:1;}
    HAND.el.style.opacity=o;HAND.el.style.transform=`translate(${x-20}px,${y-6}px) scale(${s})`;
  }else HAND.el.style.opacity=0;
  HAND.raf=requestAnimationFrame(handTick);
}
function svgPtFromScreen(p){const m=stage.getScreenCTM();return {x:(p.x-m.e)/m.a,y:(p.y-m.f)/m.d};}

/* ================= 小动物自己的生活 ================= */
// 每只小动物的性格：走路快慢、走路是蹦还是摇、最爱干什么（数字越大越爱）
const LIFE={
  cat:  {speed:95, likes:{sleep:5,sit:3,ball:2,walk:2,friend:1}},
  dog:  {speed:125,likes:{ball:6,sport:4,eat:4,walk:3,friend:2,sit:1,slide:1}},
  bunny:{speed:115,hop:1,likes:{walk:4,slide:3,dance:2,friend:2,sleep:1,swing:1,sport:1}},
  bear: {speed:75, likes:{eat:5,sleep:3,sit:3,walk:1,pit:1}},
  panda:{speed:70, likes:{eat:4,swing:3,sleep:3,sit:2,walk:1,sport:2}},
  chick:{speed:135,hop:1,likes:{walk:4,pit:3,bounce:3,dance:2,friend:1,sport:2}},
  pig:  {speed:80, likes:{eat:5,bath:4,pit:2,walk:1,sit:1,sport:1}},
  frog: {speed:100,hop:1,likes:{bath:4,bounce:4,walk:2,dance:1}},
  fox:  {speed:115,likes:{ball:4,sport:4,slide:3,friend:3,walk:2,rock:2}},
};
const SEATMODES=new Set(['sleep','sit','eat','slide','swing','bounce','bath','pit','rock']);
const DUR={sleep:[16,26],sit:[8,14],eat:[6,9],slide:[8,12],swing:[8,13],bounce:[6,10],bath:[10,15],pit:[8,12],rock:[8,12]};
const BR={},PH={};
let NODES=new Map(),lifeLast=0,tbOpen=false,tbTimer=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
const nowS=()=>performance.now()/1000;
function brain(it){if(it.home==null)it.home=segOf(it);return BR[it.id]||(BR[it.id]={st:'idle',until:nowS()+rnd(1,4)});}
function cacheNodes(){
  NODES=new Map();
  stage.querySelectorAll('#mainL [data-id]').forEach(e=>{if(!NODES.has(e.dataset.id))NODES.set(e.dataset.id,e);});
  for(const it of items()){const b=BR[it.id];if(b&&b.st==='walk')setWalk(it,true);}
}
function setWalk(it,on){
  const e=NODES.get(it.id),g=e&&e.querySelector('.idle');if(!g)return;
  g.classList.toggle((LIFE[it.t]||{}).hop?'hopwalk':'walk',on);
}
function placeNode(it){
  const e=NODES.get(it.id);if(!e)return;const S=it.s*depth(it);
  e.setAttribute('transform',`translate(${r1(it.x)} ${r1(it.y-(FLY[it.id]||0))}) scale(${r3(S*(it.f?-1:1))} ${r3(S)})`);
  layout[it.id]={x:it.x,y:it.y,S};
  if(it.role==='adult'){const lb=e.querySelector('.lbl');if(lb)lb.setAttribute('transform',`translate(0 -222) scale(${it.f?-1:1} 1)`);}
  const p=PH[it.id],rg=p&&e.querySelector('.roll');
  if(rg)rg.setAttribute('transform',`translate(0 ${r1(-p.z/S)}) rotate(${r1(p.a)} 0 -34)`);
}
const depthT={};
function fixDepth(it){
  if(FLY[it.id])return;
  const t=nowS();if(depthT[it.id]&&t-depthT[it.id]<.3)return;depthT[it.id]=t;
  const c=mainL.querySelector(`:scope > [data-cluster="${it.id}"]`);if(!c)return;
  const sibs=[...mainL.children],yOf=n=>{const o=getItem(n.dataset.cluster);return o?o.y:0;};
  const i=sibs.indexOf(c),prev=sibs[i-1],next=sibs[i+1];
  if((prev&&yOf(prev)>it.y)||(next&&yOf(next)<it.y)){
    const before=sibs.find(n=>n!==c&&yOf(n)>it.y);mainL.insertBefore(c,before||null);
    const b=BR[it.id];if(b&&b.st==='walk')setWalk(it,true);
  }
}
const isBall=it=>{const d=def(it);return !!(d&&d.phys);};
function freeSeats(mode,me){
  const out=[];
  for(const h of items()){const d=def(h);if(!d||!d.seats||Math.abs(h.x-me.x)>1800)continue;
    d.seats.forEach((st,i)=>{
      if(st.m!==mode)return;
      if(items().some(o=>o.h===h.id&&o.si===i))return;
      if(Object.entries(BR).some(([id,b])=>id!==me.id&&b.res===h.id+':'+i))return;
      out.push({h,i});});}
  return out;
}
function pickActivity(it){
  const L=LIFE[it.t],opts=[];
  for(const [k,w] of Object.entries(L.likes)){
    if(SEATMODES.has(k)){const s=freeSeats(k,it);if(s.length)opts.push([k,w,s[Math.random()*s.length|0]]);}
    else if(k==='ball'){const bs=items().filter(i=>isBall(i)&&!i.h&&Math.abs(i.x-it.x)<1600);if(bs.length)opts.push([k,w,bs[Math.random()*bs.length|0]]);}
    else if(k==='friend'){const fs=items().filter(i=>i.k==='a'&&i!==it&&!i.h&&Math.abs(i.x-it.x)<1600);if(fs.length)opts.push([k,w,fs[Math.random()*fs.length|0]]);}
    else opts.push([k,w,null]);
  }
  opts.push(['visit',1.6,null]);
  let sum=opts.reduce((a,o)=>a+o[1],0),r=Math.random()*sum;
  for(const o of opts){r-=o[1];if(r<=0)return o;}
  return ['walk',1,null];
}
function startActivity(it,b,t){
  if(canFly(it)&&Math.random()<.5){startFly(it,b,t,clamp(it.x+(Math.random()<.5?-1:1)*rnd(500,1400),80,WORLD_W()-80),clampY(it,rnd(FL+80,860)));return;}
  const [k,,arg]=pickActivity(it),S=it.s*depth(it);
  b.act={k};b.res=null;
  if(SEATMODES.has(k)){
    const {h,i}=arg,p=seatPos(h,i),hS=h.s*depth(h);
    b.act.h=h.id;b.act.i=i;b.res=h.id+':'+i;
    walkTo(it,b,t,clamp(p.x,60,WORLD_W()-60),clampY(it,h.y+18*hS));
  }else if(k==='ball'){b.act.id=arg.id;walkTo(it,b,t,arg.x,arg.y);}
  else if(k==='sport'){const r=Math.random()<.55?'soccer':'basket';b.act.room=r;walkTo(it,b,t,roomIdx(r)*SEG+rnd(500,1100),rnd(660,840));b.walkUntil=t+70;}
  else if(k==='friend'){b.act.id=arg.id;walkTo(it,b,t,arg.x+(it.x<arg.x?-1:1)*110*S,arg.y+rnd(-10,10));}
  else if(k==='dance'){
    b.st='do';b.until=t+2.6;
    [0,650,1300,1950].forEach(ms=>setTimeout(()=>{if(BR[it.id]===b&&b.st==='do'&&!it.h)anim(it.id,'hop');},ms));
    emote(it,'🎵');
  }else if(k==='visit'&&it.home!=null&&segOf(it)!==it.home&&Math.random()<.65){
    walkTo(it,b,t,it.home*SEG+rnd(300,1300),clampY(it,rnd(FL+80,860)));b.walkUntil=t+40;
  }else if(k==='visit'){const dir=Math.random()<.5?-1:1;walkTo(it,b,t,clamp(it.x+dir*rnd(900,1700),80,WORLD_W()-80),clampY(it,rnd(FL+80,860)));b.walkUntil=t+28;}
  else walkTo(it,b,t,clamp(it.x+rnd(-450,450),80,WORLD_W()-80),clampY(it,it.y+rnd(-160,160)));
}
function walkTo(it,b,t,x,y){
  b.st='walk';b.tx=x;b.ty=y;b.walkUntil=t+12;setWalk(it,true);
  if(sel===it.id&&tbOpen){tbOpen=false;placeToolbar();}
}
function stopWalk(it,b,t,rest=[2.5,6]){b.st='idle';b.until=t+rnd(...rest);b.res=null;setWalk(it,false);save();}
function walkStep(it,b,dt,t){
  if(b.act.k==='ball'){const ball=getItem(b.act.id);if(!ball||ball.h)return stopWalk(it,b,t);
    b.tx=ball.x-Math.sign((ball.x-it.x)||1)*40*it.s*depth(it);b.ty=ball.y;}
  if(b.act.k==='friend'){const f=getItem(b.act.id);if(!f||f.h)return stopWalk(it,b,t);}
  const sp=LIFE[it.t].speed*it.s*depth(it),dx=b.tx-it.x,dy=(b.ty-it.y)*1.5,d=Math.hypot(dx,dy),step=sp*dt;
  if(Math.abs(dx)>6){const nf=dx>0;if(it.f!==nf)it.f=nf;}
  if(d<=step+3||t>b.walkUntil){it.x=b.tx;it.y=b.ty;placeNode(it);arrive(it,b,t);return;}
  it.x+=dx/d*step;it.y+=dy/d*step/1.5;placeNode(it);fixDepth(it);
}
function arrive(it,b,t){
  setWalk(it,false);const k=b.act.k;
  if(SEATMODES.has(k)){
    const h=getItem(b.act.h);
    if(h&&!items().some(o=>o.h===h.id&&o.si===b.act.i)){
      it.h=h.id;it.si=b.act.i;it.auto=true;b.res=null;b.st='seated';
      b.seatUntil=t+rnd(...(DUR[k]||[8,14]));refresh(it);anim(it.id,'jump');
      if(MODE_SND[k]&&Math.random()<.6)MODE_SND[k]();
      save();return;
    }
    return stopWalk(it,b,t,[1,3]);
  }
  if(k==='ball'){
    const ball=getItem(b.act.id);
    if(ball&&!ball.h&&Math.hypot(ball.x-it.x,(ball.y-it.y)*1.5)<120*it.s*depth(it)){
      const ang=Math.atan2((ball.y-it.y)*1.5,ball.x-it.x)+rnd(-.5,.5),pw=rnd(380,620);
      kickBall(ball,Math.cos(ang)*pw,Math.sin(ang)*pw/1.5,rnd(150,380));anim(it.id,'hop');
      if(Math.random()<.5)emote(it,['⚽','💨','😆'][Math.random()*3|0]);
    }
    return stopWalk(it,b,t,[1,3]);
  }
  if(k==='sport'){if(segOf(it)===roomIdx(b.act.room)&&!state.night){setWalk(it,false);joinSport(it,b,b.act.room,t);return;}return stopWalk(it,b,t);}
  if(k==='friend'){
    const f=getItem(b.act.id);
    if(f&&!f.h){it.f=f.x>it.x;placeNode(it);anim(it.id,'hop');setTimeout(()=>anim(f.id,'hop'),300);emote(it,'💕');setTimeout(()=>emote(f,'💕'),400);
      const fb=brain(f);if(fb.st!=='walk'&&fb.st!=='seated'){fb.st='idle';fb.until=t+3;}}
    b.st='do';b.until=t+2.4;save();return;
  }
  stopWalk(it,b,t);
}
function getOff(it){
  const L=layout[it.id]||{x:it.x,y:it.y},h=getItem(it.h);
  it.h=null;it.si=null;it.auto=false;
  it.x=clamp(L.x,60,WORLD_W()-60);it.y=clampY(it,h?h.y+30*h.s*depth(h):L.y+40);
  refresh(it,h);anim(it.id,'hop');
}
function lifeStep(dt,t){
  if(story)return;
  for(const it of items()){
    if(it.k!=='a'||(drag&&drag.it===it)||it.role||it.hidden)continue;
    const b=brain(it);
    if(b.st==='fly'){flyStep(it,b,t);continue;}
    if(b.pause&&t<b.pause)continue;
    if(b.sport){if(t>b.sportUntil||segOf(it)!==roomIdx(b.sport)||b.task)leaveSport(it);continue;}
    if(b.task&&!b.naughty){taskStep(it,b,dt,t);continue;}
    if(it.nap)continue;
    if(it.h){
      if(it.auto===false){b.st='seated';continue;}
      const h=getItem(it.h),m=h&&def(h).seats[it.si]?def(h).seats[it.si].m:'sit';
      if(b.st!=='seated'){b.st='seated';b.seatUntil=t+rnd(...(DUR[m]||[8,14]));}
      if(t>b.seatUntil){getOff(it);b.st='idle';b.until=t+rnd(2,5);}
      continue;
    }
    if(b.st==='seated'){b.st='idle';b.until=t+rnd(2,5);}
    if(b.st==='idle'){if(t>b.until)startActivity(it,b,t);}
    else if(b.st==='walk')walkStep(it,b,dt,t);
    else if(b.st==='do'&&t>b.until){b.st='idle';b.until=t+rnd(2.5,6);}
  }
}
function pauseBrain(it,sec){const b=brain(it);if(b.st==='walk'){setWalk(it,false);b.res=null;}b.st='idle';b.until=nowS()+sec;b.pause=nowS()+sec;}

/* ================= 球：会滚、会弹、会撞 ================= */
function kickBall(b,vx,vy,vz){
  const p=PH[b.id]||(PH[b.id]={vx:0,vy:0,z:0,vz:0,a:0});
  p.vx=vx;p.vy=vy;p.vz=vz;p.on=true;sfx.kick();
}
function physStep(dt){
  const balls=items().filter(i=>isBall(i)&&!i.h&&!(drag&&drag.it===i));
  const ans=items().filter(i=>i.k==='a'&&!i.h&&!(drag&&drag.it===i));
  for(const b of balls){
    const p=PH[b.id];if(!p||!p.on)continue;
    const Sb=b.s*depth(b);
    b.x+=p.vx*dt;b.y+=p.vy*dt;p.vz-=1500*dt;p.z+=p.vz*dt;
    if(p.z<=0){p.z=0;if(p.vz<-170){p.vz=-p.vz*.5;sfx.bounce();}else p.vz=0;const fr=Math.pow(.42,dt);p.vx*=fr;p.vy*=fr;}
    p.a+=p.vx*dt*1.7;
    if(b.x<60){b.x=60;p.vx=Math.abs(p.vx)*.75;sfx.bounce();}
    if(b.x>WORLD_W()-60){b.x=WORLD_W()-60;p.vx=-Math.abs(p.vx)*.75;sfx.bounce();}
    sportStep(b,p);
    const y0=FL+30,y1=888;
    if(b.y<y0){b.y=y0;p.vy=Math.abs(p.vy)*.75;}
    if(b.y>y1){b.y=y1;p.vy=-Math.abs(p.vy)*.75;}
    if(p.z<70){
      // 撞到小动物：弹开，小动物吓一跳
      for(const a of ans){
        const Sa=a.s*depth(a),dx=b.x-a.x,dy=(b.y-a.y)*1.8,d=Math.hypot(dx,dy),Rr=34*Sb+36*Sa;
        if(d<Rr&&d>.01){
          const nx=dx/d,ny=dy/d;b.x=a.x+nx*Rr;b.y=a.y+ny*Rr/1.8;
          const vy2=p.vy*1.8,vn=p.vx*nx+vy2*ny;
          if(vn<0){p.vx-=1.8*vn*nx;p.vy=(vy2-1.8*vn*ny)/1.8;
            if(vn<-220){anim(a.id,'hop');sfx.bump();const ab=brain(a);if(ab.st==='idle'&&(LIFE[a.t].likes.ball||0)>0&&Math.random()<.5)ab.until=nowS()+.4;}}
          if(Math.hypot(p.vx,p.vy)<60){p.vx+=nx*90;p.vy+=ny*50;}
        }
      }
    }
    // 球撞球
    for(const o of balls){
      if(o===b)continue;const q=PH[o.id]||(PH[o.id]={vx:0,vy:0,z:0,vz:0,a:0});
      const So=o.s*depth(o),dx=o.x-b.x,dy=(o.y-b.y)*1.8,d=Math.hypot(dx,dy),Rr=34*(Sb+So);
      if(d<Rr&&d>.01&&Math.abs(p.z-q.z)<50){
        const nx=dx/d,ny=dy/d,ov=(Rr-d)/2;
        b.x-=nx*ov;b.y-=ny*ov/1.8;o.x+=nx*ov;o.y+=ny*ov/1.8;
        const v1=p.vx*nx+p.vy*1.8*ny,v2=q.vx*nx+q.vy*1.8*ny;
        if(v1-v2>0){const dv=(v1-v2)*.9;p.vx-=dv*nx;p.vy-=dv*ny/1.8;q.vx+=dv*nx;q.vy+=dv*ny/1.8;q.on=true;sfx.bounce();}
      }
    }
    if(Math.hypot(p.vx,p.vy)<8&&p.z===0&&p.vz===0){p.on=false;p.vx=p.vy=0;save();}
    placeNode(b);fixDepth(b);
  }
}
let rafLast=0;
function lifeTick(ts,maxDt=.05){
  const t=ts/1000,dt=Math.min(maxDt,t-(lifeLast||t));lifeLast=t;
  if(!document.hidden){try{camStep(dt);physStep(dt);schedStep(dt,t);lifeStep(dt,t);matchStep(dt,t);seekHint(t);}catch(e){console.error(e);}}
}
function lifeLoop(ts){rafLast=performance.now();lifeTick(ts);requestAnimationFrame(lifeLoop);}
// 保底：逐帧刷新被浏览器暂停时，用定时器按真实时间继续推动
setInterval(()=>{const now=performance.now();if(now-rafLast>300)lifeTick(now,.15);},100);

/* ================= 世界：镜头、拖动画面换房间 ================= */
function computeView(){
  const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
  viewW=clamp(900*r.width/r.height,1000,3200);clampCam();applyCam();
}
function clampCam(){camX=clamp(camX,0,Math.max(0,WORLD_W()-viewW));}
function applyCam(){stage.setAttribute('viewBox',`${r1(camX)} 0 ${r1(viewW)} 900`);updateRoomFromCam();updateNav();}
const camRoom=()=>ROOMS[clamp(Math.floor((camX+viewW/2)/SEG),0,ROOMS.length-1)].id;
let roomSpoken=null;
function updateRoomFromCam(){
  if(story)return;const id=camRoom();
  if(id!==state.room){state.room=id;renderRooms();musicUpdate();paintWrap();}
}
function goRoom(id,instant){
  const t=clamp(roomIdx(id)*SEG+SEG/2-viewW/2,0,Math.max(0,WORLD_W()-viewW));
  if(instant){camX=t;camTarget=null;camV=0;applyCam();}else{camTarget=t;camV=0;}
}
function camMoved(){if(tbOpen){tbOpen=false;placeToolbar();}}
function camSettled(){
  save();paintWrap();
  if(!story&&state.room!==roomSpoken&&welcomed){roomSpoken=state.room;talk(['rm_'+state.room]);}
}
function camStep(dt){
  if(pan)return;
  if(camTarget!=null){const d=camTarget-camX;camX+=d*Math.min(1,dt*7);if(Math.abs(d)<1.5){camX=camTarget;camTarget=null;applyCam();camSettled();}else{applyCam();camMoved();}}
  else if(Math.abs(camV)>8){const c0=camX;camX+=camV*dt;camV*=Math.pow(.05,dt);clampCam();if(camX===c0)camV=0;applyCam();camMoved();if(Math.abs(camV)<=8){camV=0;camSettled();}}
  // 拖着东西走到屏幕边上，画面跟着走
  if(drag&&drag.moved&&drag.lcx!=null&&!story){
    const r=stage.getBoundingClientRect();let v=0;
    if(drag.lcx<r.left+56)v=-1;else if(drag.lcx>r.right-56)v=1;
    if(v){const c0=camX;camX+=v*750*dt;clampCam();if(camX!==c0){applyCam();const p=svgPtXY(drag.lcx,drag.lcy);if(drag.acc)moveGhost(p);else moveTo(p);}}
  }
}
function svgPtXY(x,y){const p=stage.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(stage.getScreenCTM().inverse());}
function startPan(e){
  if(story)return;
  pan={pid:e.pointerId,sx:e.clientX,cam0:camX,lx:e.clientX,lt:performance.now(),v:0};camTarget=null;camV=0;
}
function panMove(e){
  const k=viewW/stage.getBoundingClientRect().width;
  camX=pan.cam0-(e.clientX-pan.sx)*k;clampCam();applyCam();
  const t=performance.now(),dt=Math.max(1,t-pan.lt)/1000,inst=-(e.clientX-pan.lx)*k/dt;
  pan.v=pan.v*.5+inst*.5;pan.lx=e.clientX;pan.lt=t;camMoved();
}
function panEnd(){
  camV=performance.now()-pan.lt<120?clamp(pan.v,-4500,4500):0;pan=null;if(!camV)camSettled();
}
let wheelT=0;
stage.addEventListener('wheel',e=>{
  if(story)return;const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  camX+=d*1.3;camTarget=null;camV=0;clampCam();applyCam();camMoved();e.preventDefault();
  clearTimeout(wheelT);wheelT=setTimeout(camSettled,300);
},{passive:false});

/* ---------- 只重画受影响的几个东西（小动物上下家具时用，避免整屏闪一下） ---------- */
function refresh(...its){
  const ids=new Set();
  for(const it of its){if(!it)continue;ids.add(it.id);const h=it.h&&getItem(it.h);if(h)ids.add(h.id);}
  for(const id of ids){const c=stage.querySelector(`[data-cluster="${id}"]`);if(c)c.remove();}
  for(const id of ids){
    const it=getItem(id);if(!it||it.h)continue;
    const d=def(it),layer=d&&d.wall?wallL:d&&d.floor?floorL:mainL;
    const tmp=document.createElementNS(SVGNS,'g');tmp.innerHTML=cluster(it);const node=tmp.firstElementChild;
    const before=[...layer.children].find(n=>{const o=getItem(n.dataset.cluster);return o&&o.y>it.y;});
    layer.insertBefore(node,before||null);
  }
  cacheNodes();markSel();
}

function sportStep(b,p){
  // 进球：球滚进对面球门
  if(segOf(b)===roomIdx('soccer')&&!p.scored)
    for(const g of worldGoals())if(Math.abs(b.x-g.x)<86&&b.y<600&&p.z<120){
      p.scored=true;p.vx*=.15;p.vy=Math.min(0,p.vy*.15);
      cheerAt(g.x,520,null,'⚽');onScore('soccer',g.team,1);
      setTimeout(()=>{p.on=false;p.vx=p.vy=p.vz=p.z=0;p.scored=false;b.x=roomIdx('soccer')*SEG+800;b.y=740;justAdded=b.id;refresh(b);save();},2600);
      return;
    }
  // 投篮：飞到篮筐时决定进没进
  if(p.shot&&nowS()>=p.shot.t){
    const s=p.shot;p.shot=null;
    if(s.make){b.x=s.x;b.y=s.y;p.z=s.H-6;p.vx=p.vy=0;p.vz=-60;cheerAt(s.x,s.y-s.H,null,'🏀');onScore('basket',s.team,2);
      setTimeout(()=>{if(!getItem(b.id))return;const q=PH[b.id];q.on=false;q.vx=q.vy=q.vz=q.z=0;q.shot=null;b.x=roomIdx('basket')*SEG+800;b.y=740;justAdded=b.id;refresh(b);},1800);}
    else{p.vx=-p.vx*.35+rnd(-90,90);p.vy=rnd(40,120);p.vz=260;sfx.bounce();}
  }
}
function cheerAt(x,y,line,ic){
  sfx.cheer();fx(x,y,'confetti',18);fx(x,y-40,'star',8);if(line)say([line]);
  for(const a of items())if(a.k==='a'&&!a.h&&Math.abs(a.x-x)<900){setTimeout(()=>{anim(a.id,'hop');emote(a,ic);},rnd(100,600));}
}
function shootBall(b,hx,team){
  const hs=worldHoops();let h=hs[0];
  if(hx!=null)h=hs.find(o=>Math.abs(o.x-hx)<1)||h;else for(const o of hs)if(Math.abs(o.x-b.x)<Math.abs(h.x-b.x))h=o;
  const T=1.15,g=1500,make=Math.random()<(team?.6:.75),ex=make?0:rnd(-40,40);
  kickBall(b,(h.x+ex-b.x)/T,(h.y-b.y)/T,(h.H+.5*g*T*T)/T);
  PH[b.id].shot={t:nowS()+T,x:h.x,y:h.y,H:h.H,make,team:team||h.team};
}
function aimSoccer(b){
  const gs=worldGoals();let g=gs[0];for(const o of gs)if(Math.abs(o.x-b.x)<Math.abs(g.x-b.x))g=o;
  const tx=g.x+rnd(-70,70),ty=560,d=Math.hypot(tx-b.x,(ty-b.y)*1.5),sp=Math.min(900,Math.max(450,d*1.6));
  kickBall(b,(tx-b.x)/d*sp,(ty-b.y)/d*sp,rnd(120,260));
}

const canFly=it=>it.k==='a'&&it.acc&&it.acc.body==='hero'&&!it.role;
function setFlyPose(it,on){const e=NODES.get(it.id);if(e)e.classList.toggle('flying',on);}
function startFly(it,b,t,tx,ty){
  b.st='fly';b.fx0=it.x;b.fy0=it.y;b.ftx=tx;b.fty=ty;b.ft0=t;b.fdur=clamp(Math.hypot(tx-it.x,ty-it.y)/330+1.4,2,7);b.res=null;
  setWalk(it,false);setFlyPose(it,true);
  const c=mainL.querySelector(`:scope > [data-cluster="${it.id}"]`);if(c)mainL.appendChild(c);
  sfx.whoosh();
}
function flyStep(it,b,t){
  const u=clamp((t-b.ft0)/b.fdur,0,1),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  it.x=b.fx0+(b.ftx-b.fx0)*e;it.y=b.fy0+(b.fty-b.fy0)*e;it.f=b.ftx>b.fx0;
  FLY[it.id]=Math.sin(Math.PI*u)*250;placeNode(it);
  if(u>=1){delete FLY[it.id];setFlyPose(it,false);placeNode(it);depthT[it.id]=0;fixDepth(it);anim(it.id,'hop');b.st='idle';b.until=t+rnd(2,5);save();}
}

function moveToward(it,tx,ty,dt,sp){
  const S=it.s*depth(it),dx=tx-it.x,dy=(ty-it.y)*1.5,d=Math.hypot(dx,dy),step=sp*S*dt,go=d>10;
  setWalk(it,go);if(!go)return;
  if(Math.abs(dx)>6)it.f=dx>0;
  const k=Math.min(1,step/d);it.x+=dx*k;it.y=clampY(it,it.y+dy*k/1.5);placeNode(it);fixDepth(it);
}
function matchStep(dt,t){
  if(story||(curPh&&curPh.act==='sleep'))return;
  for(const room of Object.keys(SPORTS)){
    const cfg=SPORTS[room],seg=roomIdx(room),x0=seg*SEG;
    const players=items().filter(i=>i.k==='a'&&!i.h&&BR[i.id]&&BR[i.id].sport===room);
    if(!players.length)continue;
    let ball=items().find(i=>i.t===cfg.ball&&!i.h&&segOf(i)===seg&&!(drag&&drag.it===i));
    if(!ball){if(drag&&drag.it.t===cfg.ball)continue;ball=T(cfg.ball,x0+800,740);items().push(ball);justAdded=ball.id;refresh(ball);}
    const p=PH[ball.id]||(PH[ball.id]={vx:0,vy:0,z:0,vz:0,a:0});
    for(const team of ['red','blue']){
      const ps=players.filter(i=>BR[i.id].team===team),dir=cfg.target[team]>800?1:-1;
      let chaser=null,bd=1e9;
      for(const pl of ps){if(drag&&drag.it===pl)continue;const d=Math.hypot(pl.x-ball.x,(pl.y-ball.y)*1.5);if(d<bd){bd=d;chaser=pl;}}
      ps.forEach((pl,k)=>{
        if(drag&&drag.it===pl)return;
        const m=MT[pl.id]||(MT[pl.id]={cd:rnd(0,1)});m.cd-=dt;
        let tx,ty;
        if(pl===chaser&&!p.scored&&!p.shot){tx=ball.x-dir*40*pl.s*depth(pl);ty=ball.y;}
        else{tx=clamp(ball.x-dir*(170+k*130),x0+120,x0+1480);ty=[640,820,730][k%3];}
        moveToward(pl,clamp(tx,x0+90,x0+1510),ty,dt,(LIFE[pl.t].speed+70)*1.2);
        if(pl===chaser&&m.cd<=0&&!p.shot&&!p.scored&&p.z<40&&Math.hypot(pl.x-ball.x,(pl.y-ball.y)*1.5)<80*pl.s*depth(pl)){
          m.cd=rnd(.8,1.3);anim(pl.id,'hop');
          if(room==='soccer'){
            const gx=x0+cfg.target[team],far=Math.abs(gx-ball.x)>520;
            const ang=far?Math.atan2(rnd(-60,60),dir):Math.atan2(560-ball.y,gx+rnd(-90,90)-ball.x),pw=far?rnd(330,470):rnd(560,780);
            kickBall(ball,Math.cos(ang)*pw,Math.sin(ang)*pw*.8,rnd(60,200));
          }else{
            const hx=x0+cfg.target[team];
            if(Math.abs(hx-ball.x)>380)kickBall(ball,dir*rnd(260,380),rnd(-60,60),rnd(160,260));
            else shootBall(ball,hx,team);
          }
        }
      });
    }
    // 观众时不时喊加油
    if(segVisible(room)&&t>chantT&&!VOX.res){chantT=t+rnd(14,22);talk([Math.random()<.5?'m_cheer_red':'m_cheer_blue']);}
  }
}

const MZ_LV=[[5,4],[7,5],[9,6],[11,7]];
let MZ=null;
function genMaze(c,r){
  const cells=Array.from({length:r},()=>Array.from({length:c},()=>({n:1,e:1,s:1,w:1,v:0})));
  const st=[[0,0]];cells[0][0].v=1;
  while(st.length){
    const [x,y]=st[st.length-1];
    const nb=[[x,y-1,'n','s'],[x+1,y,'e','w'],[x,y+1,'s','n'],[x-1,y,'w','e']].filter(([a,b])=>a>=0&&b>=0&&a<c&&b<r&&!cells[b][a].v);
    if(!nb.length){st.pop();continue;}
    const [a,b,d,o]=nb[Math.random()*nb.length|0];cells[y][x][d]=0;cells[b][a][o]=0;cells[b][a].v=1;st.push([a,b]);
  }
  return cells;
}
function openMaze(){
  stopVO();const lv=Math.min(state.mazeLv||0,MZ_LV.length-1),[c,r]=MZ_LV[lv];
  const a=getItem(lastAnimal)||items().find(i=>i.k==='a'&&segOf(i)===roomIdx('maze'))||{t:'bunny',c:0};
  MZ={c,r,cells:genMaze(c,r),x:0,y:0,lv,t:a.t,ci:a.c||0,trail:['0,0'],done:false};
  drawMaze();$('#mazeOv').hidden=false;sfx.page();say(['mz_start']);
}
function drawMaze(){
  const {c,r,cells}=MZ,S=100,svg=$('#mazeSvg');
  svg.setAttribute('viewBox',`-30 -30 ${c*S+60} ${r*S+60}`);
  let s=R(-30,-30,c*S+60,r*S+60,34,'#7FCF8A','stroke="#5B4A55" stroke-width="5"');
  for(let y=0;y<r;y++)for(let x=0;x<c;x++){
    const cx=x*S,cy=y*S;s+=R(cx+14,cy+14,S-28,S-28,18,'#F5E8C8',NS);
    if(!cells[y][x].e)s+=R(cx+50,cy+14,S,S-28,0,'#F5E8C8',NS);
    if(!cells[y][x].s)s+=R(cx+14,cy+50,S-28,S,0,'#F5E8C8',NS);
  }
  s+=MZ.trail.map(k=>{const [x,y]=k.split(',').map(Number);return C(x*S+50,y*S+50,7,'#FFB5C8',NS);}).join('');
  s+=`<text x="${(c-1)*S+50}" y="${(r-1)*S+68}" text-anchor="middle" font-size="52" class="${MZ.done?'':'pulse'}">${['🥕','🍰','🍎','⭐'][MZ.lv%4]}</text>`;
  s+=`<g transform="translate(${MZ.x*S+50} ${MZ.y*S+84}) scale(.42)" stroke="${O}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${animalArt(MZ.t,MZ.ci,{eyes:MZ.done?'happy':'open'})}</g>`;
  svg.innerHTML=s;
  $('#mzDots').innerHTML=MZ_LV.map((_,i)=>`<i class="${i<=MZ.lv?'on':''}"></i>`).join('');
  $('#mzNext').hidden=!MZ.done;
}
let mzBump=0;
function mazeStep(dx,dy){
  if(!MZ||MZ.done)return;
  const d=dx>0?'e':dx<0?'w':dy>0?'s':'n',cell=MZ.cells[MZ.y][MZ.x];
  if(cell[d]){const t=performance.now();if(t-mzBump>400){mzBump=t;sfx.bump();}return;}
  MZ.x+=dx;MZ.y+=dy;const k=MZ.x+','+MZ.y;if(!MZ.trail.includes(k))MZ.trail.push(k);
  tone(500+MZ.trail.length*12,.06,{vol:.06,type:'triangle'});
  if(MZ.x===MZ.c-1&&MZ.y===MZ.r-1){
    MZ.done=true;state.mazeLv=Math.min((state.mazeLv||0)+1,MZ_LV.length-1);save();
    drawMaze();sfx.cheer();addStars(1,$('#mazeSvg'));say(['mz_done']);return;
  }

}
function mazePointer(e){
  if(!MZ||MZ.done)return;

  if(Math.abs(dx)+Math.abs(dy)===1)mazeStep(dx,dy);

let HS=null,hsHintT=0;
const isHideSpot=it=>{const d=def(it);return !!(d&&d.seats&&d.seats[0].m==='hide');};
// 能躲在后面的大件东西
const COVER=new Set(['bed','sofa','armchair','bookshelf','fridge','stove','tv','bathtub','tree','tent','castle','piano','bakery','icecart','desk','mazegate','fence','sandbox','ballpit','flowers']);
const camSeg=()=>clamp(Math.floor((camX+viewW/2)/SEG),0,ROOMS.length-1);
async function startSeek(){
  if(HS){say(['hs_go']);return;}
  if(story)return;
  const cs=camSeg(),near=i=>Math.abs(segOf(i)-cs)<=2;
  const used=new Set(items().filter(o=>o.h).map(o=>o.h));
  const spots=items().filter(i=>near(i)&&(isHideSpot(i)&&!used.has(i.id)||COVER.has(i.t))).sort(()=>Math.random()-.5);
  // 尽量分散在不同的房间：先每个房间挑一个
  const pick=[],segsUsed=new Set();
  for(const s of spots)if(!segsUsed.has(segOf(s))){pick.push(s);segsUsed.add(segOf(s));}
  for(const s of spots)if(!pick.includes(s))pick.push(s);
  const cx=camX+viewW/2;

  const n=Math.min(3,pick.length,animals.length);

  sel=null;tbOpen=false;placeToolbar();
  $('#seekOv').hidden=false;sfx.page();

  for(let k=0;k<n;k++){
    const a=animals[k],h=pick[k];pauseBrain(a,1e6);a.hidden=true;a.auto=false;
    if(isHideSpot(h)){a.h=h.id;a.si=0;}

/* ================= 作息时间表 ================= */
// clock：一天里的分钟数（0~1440）；rate：现实 1 秒走几分钟
const PHASES=[
  {id:'breakfast',start:420,end:480,who:'mom',room:'kitchen',act:'eat',ic:'🍳',n:'早饭',line:'sched_wake',rate:.5},
  {id:'class',start:480,end:600,who:'teacher',room:'classroom',act:'class',ic:'📚',n:'上课',line:'sched_class',rate:.5},
  {id:'pe',start:600,end:690,who:'pe',room:'school',act:'pe',ic:'🤸',n:'体育课',line:'sched_pe',rate:.5},
  {id:'lunch',start:690,end:750,who:'mom',room:'kitchen',act:'eat',ic:'🍚',n:'午饭',line:'sched_lunch',rate:.5},
  {id:'free',start:750,end:1050,who:null,act:'free',ic:'🎈',n:'自由玩',line:'sched_free',rate:.5},
  {id:'dinner',start:1050,end:1110,who:'mom',room:'kitchen',act:'eat',ic:'🍲',n:'晚饭',line:'sched_dinner',rate:.5},
  {id:'evening',start:1110,end:1200,who:'dad',act:'free',ic:'🧸',n:'玩一会儿',line:'sched_evening',rate:.5},
  {id:'sleep',start:1200,end:1860,who:'dad',act:'sleep',ic:'😴',n:'睡觉',line:'sched_sleep',rate:3},
];
if(state.clock==null)state.clock=760;
const phaseAt=c=>{const m=c<420?c+1440:c;return PHASES.find(p=>m>=p.start&&m<p.end)||PHASES[4];};
let curPh=null,schedT=0,peBeat=0,peN=0,clockSaveT=0;
const NAUGHTY=[],AM={};
const kids=()=>items().filter(i=>i.k==='a'&&!i.role&&!i.hidden);
const fmtClock=c=>{const h=Math.floor(c/60)%24,m=Math.floor(c%60);return h+':'+String(m).padStart(2,'0');};
const near=(it,x,y)=>Math.hypot(it.x-x,(it.y-y)*1.5)<16;

function spotsIn(room,n,rows,x0=320,x1=1300){
  const base=roomIdx(room)*SEG,out=[],per=Math.ceil(n/rows.length),step=per>1?(x1-x0)/(per-1):0;
  for(let r=0;r<rows.length;r++)for(let c=0;c<per;c++)out.push({x:base+x0+c*step+(r%2?step/2:0)*(per>1?1:0),y:rows[r]});
  return out.slice(0,Math.max(n,1));
}
function freeSeatsIn(room,modes){
  const seg=roomIdx(room),out=[];
  for(const h of items()){const d=def(h);if(!d||!d.seats||segOf(h)!==seg)continue;
    d.seats.forEach((st,i)=>{if(modes.includes(st.m)&&!items().some(o=>o.h===h.id&&o.si===i))out.push({h:h.id,i});});}
  return out;
}
function assignTasks(ph,list){
  if(OWN[ph.act]){
    const rest=[];
    for(const it of list){const seat=ownedSeat(it.t,OWN[ph.act]),h=seat&&getItem(seat.h);
      if(!h){rest.push(it);continue;}
      const b=brain(it);b.taskDone=false;b.task={act:ph.act,room:ROOMS[segOf(h)].id,seat};b.res=seat.h+':'+seat.i;}
    list=rest;if(!list.length)return;
  }
  if(ph.act==='sleep'){
    // 卧室、客厅里的小朋友上床，其他小朋友原地睡
    const beds=[...freeSeatsIn('bedroom',['sleep']),...freeSeatsIn('living',['sit','sleep'])];
    for(const it of list){const b=brain(it);b.taskDone=false;
      const s=[roomIdx('bedroom'),roomIdx('living')].includes(segOf(it))&&beds.length?beds.shift():null;
      b.task={act:'sleep',seat:s,inPlace:!s};}
    return;
  }
  // 按就近分散到几个地方，每处人数有上限，免得挤成一团
  const VENUES={eat:[['kitchen',10],['pretend',10],['school',10],['living',10]],class:[['classroom',12],['school',12],['play',12]],
    pe:[['school',12],['play',12],['maze',12]]}[ph.act]||[[ph.room,40]];
  const groups=VENUES.map(()=>[]);
  const order=[...list].sort((a,b)=>{const d=k=>Math.min(...VENUES.map(([r])=>Math.abs(k.x-roomIdx(r)*SEG-800)));return d(a)-d(b);});
  for(const it of order){
    let best=-1,bd=1e12;
    VENUES.forEach(([r,cap],i)=>{if(groups[i].length>=cap)return;const d=Math.abs(it.x-roomIdx(r)*SEG-800);if(d<bd){bd=d;best=i;}});
    if(best<0)best=0;groups[best].push(it);
  }
  VENUES.forEach(([room],i)=>{
    const g=groups[i];if(!g.length)return;
    const seats=ph.act==='eat'?freeSeatsIn(room,['sit','eat']):ph.act==='class'?freeSeatsIn(room,['sit']):[];
    const spots=spotsIn(room,g.length,ph.act==='class'?[790,880]:[700,790,880],200,1400)
      .map(p=>({x:p.x+rnd(-25,25),y:p.y+rnd(-12,12)}));
    g.forEach((it,k)=>{const b=brain(it);b.taskDone=false;
      const seat=seats.length?seats.shift():null;b.task={act:ph.act,room,seat,spot:seat?null:spots[k%spots.length]};
      if(seat)b.res=seat.h+':'+seat.i;});
  });
}
function startPhase(ph,quiet){
  const t=nowS();

  if(curPh&&curPh.act!=='free')for(const it of kids()){const b=BR[it.id];
    if(b&&b.task&&b.taskDone&&!b.wasNaughty){it.score=Math.min(99,(it.score??3)+1);const L=layout[it.id];if(L&&L.x>camX&&L.x<camX+viewW)fxText(L.x,L.y-180*L.S,'+1⭐','#FFB400');}}
  curPh=ph;NAUGHTY.length=0;
  // 叫醒 / 清掉上一个任务
  for(const it of items())if(it.k==='a'){
    const b=brain(it);
    if(b.sport)leaveSport(it);
    if(b.task&&b.task.seat&&it.h===b.task.seat.h&&ph.act!=='sleep'){b.st='seated';b.seatUntil=t+rnd(1,4);}
    b.task=null;b.naughty=false;b.wasNaughty=false;b.res=null;
    if(it.nap&&ph.act!=='sleep'){it.nap=false;}
  }
  for(const id in AM){AM[id].fetch=null;AM[id].napAt=null;}
  const night=ph.act==='sleep';
  if(state.night!==night){state.night=night;}
  if(ph.act!=='free'){
    const list=kids().filter(i=>!(drag&&drag.it===i));
    // 一两个调皮鬼
    const naughtyN=Math.min(list.length>3&&Math.random()<.7?1:0,list.length);
    const shuffled=[...list].sort(()=>Math.random()-.5),bad=shuffled.slice(0,naughtyN);
    for(const it of bad){const b=brain(it);b.naughty=true;b.wasNaughty=true;NAUGHTY.push({id:it.id,at:t+rnd(12,20),who:ph.who});}
    assignTasks(ph,list.filter(i=>!bad.includes(i)));
    if(night){for(const it of items())if(it.k==='a'&&it.role&&it.role!=='adult')it.nap=true;}
  }
  render();updateClock(true);
  if(!quiet&&!story){sfx.bell();if(ph.line)setTimeout(()=>say([ph.line]),900);}
  save();
}
function schedStep(dt,t){
  if(story)return;
  const ph=phaseAt(state.clock);
  if(ph!==curPh){startPhase(ph,curPh===null);return;}
  state.clock=(state.clock+dt*ph.rate)%1440;
  if(t>clockSaveT){clockSaveT=t+10;updateClock();save();}
  adultStep(dt,t);
  // 体育课：跟着哨子一起跳
  if(ph.act==='pe'&&t>peBeat){
    peBeat=t+1.3;peN++;
    const vis=segVisible('school');
    for(const it of kids()){const b=BR[it.id];if(b&&b.task&&b.task.act==='pe'&&b.taskDone)anim(it.id,'hop');}
    for(const a of items())if(a.role==='adult'&&a.who==='pe')anim(a.id,'hop');
    if(vis&&peN%2===0)tone(1800,.08,{vol:.04,type:'square'});
    if(vis&&peN%8===0&&!VOX.res)say(['pe_count']);
  }
  // 调皮鬼：时不时做个鬼脸
  for(const n of NAUGHTY){const k=getItem(n.id);if(k&&BR[k.id]&&BR[k.id].naughty&&Math.random()<dt*.12)emote(k,'😜');}
}
// 小朋友执行任务：走到位置、坐好、睡觉……
function taskStep(it,b,dt,t){
  const k=b.task,tgt=k.seat?getItem(k.seat.h):k.spot,far=tgt?Math.abs(tgt.x-it.x):0;
  const sp=LIFE[it.t].speed*(far>3000?5:far>1200?3.2:2.2); // 路远就跑快一点
  if(k.act==='sleep'&&k.inPlace){
    if(!it.nap){if(it.h){getOff(it);}it.nap=true;b.taskDone=true;setWalk(it,false);refresh(it);}
    return;
  }
  if(k.seat){
    const h=getItem(k.seat.h);
    if(!h){k.seat=null;k.spot={x:it.x,y:it.y};return;}
    if(it.h===h.id){if(!b.taskDone){b.taskDone=true;if(k.act==='sleep'&&!it.nap){it.nap=true;refresh(it);}}return;}
    const occ=items().find(o=>o.h===h.id&&o.si===k.seat.i&&o!==it);
    if(occ&&BR[occ.id]&&BR[occ.id].task&&!(BR[occ.id].task.seat&&BR[occ.id].task.seat.h===h.id&&BR[occ.id].task.seat.i===k.seat.i)){moveToward(it,h.x,clampY(it,h.y+60),dt,sp);return;}
    if(occ){k.seat=null;k.spot={x:clamp(h.x+rnd(-200,200),60,WORLD_W()-60),y:clampY(it,h.y+60)};return;}
    if(it.h)getOff(it);
    const p=seatPos(h,k.seat.i),hS=h.s*depth(h),tx=p.x,ty=clampY(it,h.y+18*hS);
    if(near(it,tx,ty)){it.h=h.id;it.si=k.seat.i;it.auto=true;b.st='seated';b.seatUntil=1e9;b.taskDone=true;setWalk(it,false);if(k.act==='sleep')it.nap=true;refresh(it);anim(it.id,'hop');return;}
    moveToward(it,tx,ty,dt,sp);return;
  }
  if(k.spot){
    if(it.h){getOff(it);return;}
    if(near(it,k.spot.x,k.spot.y)){
      if(!b.taskDone){b.taskDone=true;setWalk(it,false);if(k.act==='sleep'){it.nap=true;refresh(it);}}
      if(k.act==='eat'&&Math.random()<dt*.12)emote(it,['😋','🍚','🥛'][Math.random()*3|0]);
      if(k.act==='class'&&Math.random()<dt*.06)emote(it,['✏️','🙋','📖'][Math.random()*3|0]);
      return;
    }
    moveToward(it,k.spot.x,k.spot.y,dt,sp);
  }
}

/* ================= 大人们自己的生活 ================= */
function adultPost(a,ph,t,m){
  const base=id=>roomIdx(id)*SEG,who=a.who,act=ph.act;
  const wander=rooms=>{if(t>m.wt||m.tx==null){const r=rooms[Math.random()*rooms.length|0];m.tx=base(r)+rnd(250,1350);m.ty=rnd(FL+90,860);m.wt=t+rnd(9,16);}return {x:m.tx,y:m.ty};};
  if(act==='sleep'){
    if(m.napAt==null)m.napAt=t+(who==='dad'?45:rnd(15,25));
    if(who==='dad'&&t<m.napAt)return wander(['bedroom','living']);
    return null; // 到点睡觉
  }
  if(who==='mom'){
    if(act==='eat'){const st=items().find(i=>i.t==='stove'&&segOf(i)===roomIdx('kitchen'));return st?{x:st.x+140,y:clampY(a,st.y+40)}:{x:base('kitchen')+500,y:820};}
    return wander(['bedroom','living','kitchen','bath','pretend']);
  }
  if(who==='dad'){
    if(act==='eat')return {x:base('kitchen')+1150,y:860};
    return wander(['living','bedroom','play','kitchen']);
  }
  if(who==='teacher'){
    if(act==='class')return {x:base('classroom')+800,y:640};
    if(act==='pe')return {x:base('school')+1350,y:700};
    return wander(['classroom','school']);
  }
  if(who==='pe'){
    if(act==='pe')return {x:base('school')+800,y:600};
    for(const r of Object.keys(SPORTS))if(segOf(a)===roomIdx(r)&&items().some(i=>BR[i.id]&&BR[i.id].sport===r)){
      const bl=ballOf(r);if(bl)return {x:clamp(bl.x+150,roomIdx(r)*SEG+100,roomIdx(r)*SEG+1500),y:850};}
    return wander(['soccer','basket','school','play']);
  }
  return null;
}
function adultStep(dt,t){
  const ph=curPh||phaseAt(state.clock);
  for(const a of items()){
    if(a.role!=='adult')continue;
    const m=AM[a.id]||(AM[a.id]={wt:0});
    // 该去管调皮鬼了
    if(!m.fetch){const n=NAUGHTY.find(n=>n.who===a.who&&t>n.at&&BR[n.id]&&BR[n.id].naughty&&!n.taken);
      if(n){n.taken=true;m.fetch=n.id;if(a.nap){a.nap=false;refresh(a);}}}
    if(m.fetch){
      const k=getItem(m.fetch),kb=k&&BR[k.id];
      if(!k||!kb||!kb.naughty){m.fetch=null;}
      else{
        const S=k.s*depth(k),tx=k.x+(a.x<k.x?-1:1)*110*S;
        if(Math.hypot(a.x-tx,(a.y-k.y)*1.5)<30){scold(a,k);m.fetch=null;}
        else moveToward(a,tx,k.y,dt,300);
        continue;
      }
    }
    const goal=adultPost(a,ph,t,m);
    if(!goal){if(!a.nap){a.nap=true;setWalk(a,false);refresh(a);}continue;}
    if(a.nap){a.nap=false;refresh(a);}
    moveToward(a,clamp(goal.x,60,WORLD_W()-60),goal.y,dt,170);
  }
}
function scold(a,k){
  const b=brain(k);b.naughty=false;
  k.score=Math.max(0,(k.score??3)-1);
  const L=layout[k.id]||{x:k.x,y:k.y,S:1},vis=L.x>camX-200&&L.x<camX+viewW+200;
  if(vis){fxText(L.x,L.y-190*L.S,'-1⭐','#FF5A5A');emote(k,'😢');setTimeout(()=>emote(a,'😠'),300);anim(a.id,'jump');say(['scold_'+a.who]);}
  if(curPh&&curPh.act!=='free')assignTasks(curPh,[k]);
  save();
}

function checkHelp(it){

  const ok=curPh.act==='sleep'?(it.h&&def(getItem(it.h)).seats[it.si].m==='sleep'):({eat:['kitchen','pretend','school','living'],class:['classroom','school','play'],pe:['school','play','maze']}[curPh.act]||[curPh.room]).includes(ROOMS[segOf(it)].id);
  if(!ok)return;
  b.naughty=false;b.wasNaughty=false;assignTasks(curPh,[it]);
  for(const id in AM)if(AM[id].fetch===it.id)AM[id].fetch=null;
  addStars(1,$('#clockHud'));sfx.cheer();say(['thanks_help']);
}

});

{const da=TH.desk.art;TH.desk.art=(c,it)=>{const r=da(c,it);if(it&&it.owner)r.f+=badge(0,-70,it.owner,30);return r;};}
function ownedSeat(sp,kind){
  for(const h of items()){if(h.t!==kind)continue;const ow=h.owners||(h.owner?[h.owner]:null);if(!ow)continue;const i=ow.indexOf(sp);if(i>=0)return {h:h.id,i:kind==='desk'?0:i};}
  return null;
}
const OWN={sleep:'bunk',eat:'longtable',class:'desk'};
function setupOwned(){
  const kSeg=roomIdx('kitchen'),bSeg=roomIdx('bedroom'),cSeg=roomIdx('classroom');
  const drop=new Set(items().filter(i=>(segOf(i)===bSeg&&i.t==='bed')||(segOf(i)===kSeg&&(i.t==='table'||i.t==='chair'))
    ||(segOf(i)===cSeg&&i.t==='desk')||i.t==='bunk'||i.t==='longtable').map(i=>i.id));
  for(const it of items())if(it.h&&drop.has(it.h)){const h=getItem(it.h);it.h=null;it.si=null;it.x=clamp(h.x+rnd(-160,160),60,WORLD_W()-60);it.y=clampY(it,h.y+70);}
  state.world=items().filter(i=>!drop.has(i.id));
  [[['cat','dog'],200],[['bunny','bear'],500],[['panda','chick'],800],[['pig','frog'],1100],[['fox'],1400]].forEach(([ow,x],i)=>{
    const b=T('bunk',bSeg*SEG+x,700,{c:i%5});b.owners=ow;items().push(b);});
  [[KIDS.slice(0,5),480],[KIDS.slice(5),1160]].forEach(([ow,x])=>{const t=T('longtable',kSeg*SEG+x,800);t.owners=ow;items().push(t);});
  const pos=[[280,690],[520,690],[760,690],[1000,690],[1240,690],[400,830],[640,830],[880,830],[1120,830]];
  KIDS.forEach((sp,i)=>{const d=T('desk',cSeg*SEG+pos[i][0],pos[i][1],{c:i%4});d.owner=sp;items().push(d);});
}

/* ================= 一种小动物只有一个 ================= */
function dedupeKids(){
  const keep={};
  for(const it of items())if(it.k==='a'&&it.role!=='adult'){const k=keep[it.t];if(!k||(it.score??3)>(k.score??3))keep[it.t]=it;}
  const kept=new Set(Object.values(keep));
  state.world=items().filter(i=>!(i.k==='a'&&i.role!=='adult'&&!kept.has(i)));
  for(const it of kept){
    delete it.role;delete it.team;delete it.sport;it.auto=true;
    if(it.acc&&/^(jersey_red|jersey_blue|referee|teacher)$/.test(it.acc.body||''))delete it.acc.body;
  }
  for(const t of KIDS)if(!keep[t])items().push(A(t,roomIdx('play')*SEG+rnd(300,1300),rnd(700,860)));
}
// 道具栏里的小动物：叫它过来（不会多出一只）
function callKid(key){
  const it=items().find(i=>i.k==='a'&&i.t===key&&i.role!=='adult');
  if(!it)return null;
  if(BR[it.id])leaveSport(it);
  it.h=null;it.si=null;it.hidden=false;it.behind=null;it.nap=false;delete FLY[it.id];
  pauseBrain(it,8);return it;
}

/* ================= 球赛：小朋友自己去打 ================= */
function joinSport(it,b,room,t){
  const others=items().filter(o=>o!==it&&BR[o.id]&&BR[o.id].sport===room),reds=others.filter(o=>BR[o.id].team==='red').length;
  const team=reds<=others.length-reds?'red':'blue';
  b.sport=room;b.team=team;b.sportUntil=t+rnd(45,90);b.st='sport';
  it.acc=it.acc||{};b.prevBody=it.acc.body||null;it.acc.body='jersey_'+team;refresh(it);emote(it,room==='soccer'?'⚽':'🏀');
}
function leaveSport(it){
  const b=BR[it.id];if(!b||!b.sport)return;
  b.sport=null;b.team=null;
  if(it.acc){if(b.prevBody)it.acc.body=b.prevBody;else delete it.acc.body;}
  b.prevBody=null;b.st='idle';b.until=nowS()+rnd(2,4);setWalk(it,false);refresh(it);
}
const ballOf=room=>items().find(i=>i.t===SPORTS[room].ball&&!i.h&&segOf(i)===roomIdx(room));
