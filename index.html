<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>动物之家</title>
<meta name="theme-color" content="#FFD1DC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--tabH:clamp(38px,6.5vh,50px);--ink:#5B4A55;--top:clamp(54px,9vh,74px);--tray:clamp(104px,19vh,150px)}
@media (max-height:520px){:root{--top:46px;--tray:92px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#FFF4EA;color:var(--ink);
  font-family:"PingFang SC","Hiragino Maru Gothic ProN","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;touch-action:manipulation}
button{font-family:inherit;color:var(--ink)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* 顶部：房间 */
#top{height:var(--top);flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:#FFF7EF;border-bottom:3px solid var(--ink);z-index:3}
#rooms{display:flex;gap:8px;flex:1;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px}
#rooms::-webkit-scrollbar{display:none}
.room-btn{flex:none;display:flex;align-items:center;gap:6px;height:calc(var(--top) - 18px);padding:0 16px 0 8px;border-radius:999px;
  border:3px solid var(--ink);background:#fff;font-size:clamp(13px,2.3vh,17px);font-weight:800;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .15s,box-shadow .15s,background .2s}
.room-btn .ic{font-size:1.45em;line-height:1}
.room-btn.on{background:var(--c);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tools{display:flex;gap:6px;flex:none}
.tool{width:calc(var(--top) - 18px);height:calc(var(--top) - 18px);border-radius:50%;border:3px solid var(--ink);background:#fff;
  font-size:clamp(16px,2.6vh,22px);cursor:pointer;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
@media (max-width:640px){.room-btn b{display:none}.room-btn{padding:0 8px}}

/* 舞台 */
#stageWrap{flex:1;position:relative;min-height:0;overflow:hidden}
#stage{position:absolute;left:0;right:0;top:0;bottom:var(--tabH);width:100%;height:calc(100% - var(--tabH));display:block;touch-action:none}
#app.trayHidden #stage{bottom:var(--tabH)}
#stage *, .card svg *{transform-origin:0 0}
#nightL,#lightL,#fxL{pointer-events:none}
#lightL{mix-blend-mode:screen;transition:opacity .4s}

/* 选中后的工具条 */
#toolbar{position:absolute;display:none;gap:6px;padding:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;
  box-shadow:0 4px 0 var(--ink);z-index:5}
#toolbar.show{display:flex;animation:tbIn .2s ease-out}
@keyframes tbIn{from{transform:scale(.6);opacity:0}}
#toolbar button{width:clamp(38px,6.2vh,50px);height:clamp(38px,6.2vh,50px);border-radius:50%;border:none;background:#FFF1F5;
  font-size:clamp(17px,2.9vh,24px);cursor:pointer;display:grid;place-items:center;padding:0}
#toolbar button:active{transform:scale(.9)}
#toolbar button[data-act=del]{background:#FFE3E3}

/* 底部抽屉 */
#tray{height:var(--tray);flex:none;position:relative;background:var(--c,#fff);border-top:3px solid var(--ink);z-index:4;transition:height .25s}
#app.trayHidden #tray{height:0;border-top-width:3px}
#tabs{position:absolute;bottom:100%;left:10px;display:flex;gap:6px;margin-bottom:-3px}
.tab{height:clamp(38px,6.5vh,50px);min-width:clamp(46px,7vh,58px);padding:0 10px;border:3px solid var(--ink);border-bottom:none;border-radius:16px 16px 0 0;
  background:var(--c);display:flex;align-items:center;gap:4px;font-size:clamp(13px,2vh,15px);font-weight:800;cursor:pointer;
  transform:translateY(6px);transition:transform .15s;opacity:.85}
.tab span{font-size:1.5em;line-height:1}
.tab.on{transform:translateY(0);opacity:1;height:calc(clamp(38px,6.5vh,50px) + 3px)}
.tab.fold{background:#fff;min-width:44px;font-size:16px}
@media (max-width:760px),(max-height:520px){.tab b{display:none}}
#cards{position:absolute;inset:0;display:flex;gap:10px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:thin}
#app.trayHidden #cards{display:none}
.card{flex:none;height:100%;aspect-ratio:.9;background:#fff;border:3px solid var(--ink);border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4px 4px 2px;cursor:grab;box-shadow:0 4px 0 rgba(91,74,85,.35);transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card.press{transform:scale(.93)}
.card svg{width:100%;flex:1;min-height:0;pointer-events:none}
.card span{font-size:clamp(11px,1.8vh,14px);font-weight:800;line-height:1.3;white-space:nowrap}

#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:20px;
  padding:8px 16px;font-weight:800;font-size:clamp(14px,2.4vh,18px);pointer-events:none;animation:hintBob 1.2s ease-in-out infinite;white-space:nowrap;z-index:2}
@keyframes hintBob{50%{transform:translateX(-50%) translateY(-6px)}}
#rotate{position:fixed;inset:0;background:rgba(255,244,234,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;font-weight:800;font-size:20px}
#rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px) and (pointer:coarse){#rotate.ask{display:flex}}

/* ---------- 场景动画 ---------- */
.idle{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.blink{animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.appear{animation:appear .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes appear{from{transform:scale(0)}to{transform:scale(1)}}
.jump{animation:jump .65s ease-out}
@keyframes jump{0%{transform:scale(1.15,.82)}35%{transform:translateY(-75px) scale(.92,1.1)}65%{transform:translateY(0) scale(1.12,.88)}82%{transform:scale(.96,1.04)}100%{transform:none}}
.hop{animation:hop .5s ease-out}
@keyframes hop{0%{transform:scale(1.1,.9)}40%{transform:translateY(-32px) scale(.96,1.05)}75%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.wiggle{animation:wiggle .55s ease-in-out}
@keyframes wiggle{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.m-swing{animation:swing 1.7s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.m-slide{animation:slideA 3.8s infinite}
@keyframes slideA{
  0%,22%{transform:translate(0,0);opacity:1;animation-timing-function:ease-in}
  55%{transform:translate(var(--dx),var(--dy));animation-timing-function:ease-out}
  64%,80%{transform:translate(var(--ex),var(--ey));opacity:1}
  87%{transform:translate(var(--ex),var(--ey));opacity:0}
  88%{transform:translate(0,0);opacity:0}
  96%,100%{transform:translate(0,0);opacity:1}}
.m-bounce{animation:bounceA 1.1s infinite}
@keyframes bounceA{
  0%{transform:translateY(0) scale(1.15,.85);animation-timing-function:ease-out}
  14%{transform:translateY(0) scale(.95,1.06);animation-timing-function:ease-out}
  50%{transform:translateY(var(--h)) scale(1,1);animation-timing-function:ease-in}
  90%{transform:translateY(0) scale(.97,1.03)}
  100%{transform:translateY(0) scale(1.15,.85)}}
.m-bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(6px) rotate(3deg)}}
.m-nod{animation:nod .9s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg) translateY(4px)}}
.zzz text{animation:zz 2.4s ease-out infinite;opacity:0}
.zzz .z2{animation-delay:.8s}.zzz .z3{animation-delay:1.6s}
@keyframes zz{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(34px,-70px) scale(1.2);opacity:0}}
.flame{animation:flicker .28s ease-in-out infinite alternate}
@keyframes flicker{to{transform:scale(.82,1.15)}}
.steam{animation:steam 2.4s ease-in-out infinite;opacity:0}
@keyframes steam{0%{transform:translateY(10px);opacity:0}30%{opacity:.9}100%{transform:translateY(-44px);opacity:0}}
.bub{animation:bub 3s ease-in infinite;opacity:0}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
.bobB{animation:bobB 3s ease-in-out infinite}
@keyframes bobB{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-8px)}}
.spin{animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hand-m{animation:spin 10s linear infinite}.hand-h{animation:spin 120s linear infinite}
.drift{animation:drift 90s linear infinite}
@keyframes drift{from{transform:translateX(-400px)}to{transform:translateX(2000px)}}
.twinkle{animation:twinkle 2s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.3}}
.fxp{animation:fxp 1.2s ease-out both}
@keyframes fxp{0%{transform:translate(0,0) scale(.2);opacity:1}25%{transform:translate(calc(var(--dx)*.3),calc(var(--dy)*.4)) scale(1.1)}100%{transform:translate(var(--dx),var(--dy)) scale(.7);opacity:0}}
.emote{animation:emote 1.9s ease-out both}
@keyframes emote{0%{transform:translateY(10px) scale(0);opacity:0}15%{transform:translateY(0) scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.pulse{animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
/* 手机横屏：左边房间栏 + 中间场景 + 右边道具栏，高度全给场景 */
@media (max-height:560px) and (min-aspect-ratio:3/2){
  #app{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:100%}
  #top{height:auto;flex-direction:column;justify-content:flex-start;padding:6px 5px;gap:6px;border-bottom:none;border-right:3px solid var(--ink);overflow-y:auto;scrollbar-width:none}
  #top::-webkit-scrollbar{display:none}
  #rooms{flex:none;flex-direction:column;overflow:visible;padding:0 0 3px;gap:6px}
  .room-btn{width:46px;height:44px;padding:0;justify-content:center;border-radius:16px;box-shadow:0 3px 0 var(--ink)}
  .room-btn b{display:none}
  .room-btn .ic{font-size:24px}
  .tools{flex-direction:column;gap:6px;margin-top:4px}
  .tool{width:46px;height:38px;border-radius:14px}
  #stage,#app.trayHidden #stage{bottom:0;height:100%}
  #tray,#app.trayHidden #tray{height:auto;display:flex;border-top:none;border-left:3px solid var(--ink)}
  #tabs{position:static;flex-direction:column;margin:0;padding:6px 0 6px 6px;gap:5px;background:#FFF7EF;overflow-y:auto;scrollbar-width:none}
  .tab,.tab.on{height:44px;min-width:0;width:48px;padding:0;justify-content:center;border:3px solid var(--ink);border-right:none;border-radius:14px 0 0 14px}
  .tab{transform:translateX(6px)}
  .tab.on{transform:none}
  .tab.fold{transform:none;border-right:3px solid var(--ink);border-radius:14px;width:44px;margin-top:auto;flex:none}
  #cards{position:static;flex-direction:column;width:104px;padding:8px;gap:8px;overflow-x:hidden;overflow-y:auto;touch-action:pan-y}
  .card{flex:none;height:86px;width:100%;aspect-ratio:auto}
  .card:hover{transform:none}
  #hint{font-size:14px;padding:6px 12px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <nav id="rooms"></nav>
    <div class="tools">
      <button class="tool" id="bNight" title="白天/晚上">🌙</button>
      <button class="tool" id="bSound" title="声音">🔊</button>
      <button class="tool" id="bReset" title="恢复这个房间">🔄</button>
      <button class="tool" id="bFull" title="全屏">⛶</button>
    </div>
  </header>
  <main id="stageWrap">
    <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="pDots" width="96" height="96" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="7" fill="#F8CBD9"/><circle cx="72" cy="72" r="7" fill="#F8CBD9"/></pattern>
        <pattern id="pStripe" width="120" height="10" patternUnits="userSpaceOnUse"><rect width="60" height="10" fill="#D4EEE0"/></pattern>
        <pattern id="pTile" width="70" height="46" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="66" height="42" rx="7" fill="#FFFCF2" stroke="#F0E0B8" stroke-width="3"/></pattern>
        <pattern id="pCheck" width="140" height="140" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#FFE0E0"/><rect x="70" y="70" width="70" height="70" fill="#FFE0E0"/></pattern>
        <pattern id="pBub" width="150" height="150" patternUnits="userSpaceOnUse"><circle cx="30" cy="40" r="11" fill="none" stroke="#C6E4F6" stroke-width="4"/><circle cx="100" cy="105" r="6" fill="none" stroke="#C6E4F6" stroke-width="3"/><circle cx="115" cy="30" r="4" fill="#C6E4F6"/></pattern>
        <pattern id="pBTile" width="56" height="56" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="52" height="52" rx="9" fill="#D8EFFB" stroke="#BDDFF2" stroke-width="3"/></pattern>
        <pattern id="pBFloor" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="#DAF0FB"/><rect x="50" y="50" width="50" height="50" fill="#DAF0FB"/></pattern>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD8FF"/><stop offset=".55" stop-color="#E6F6FF"/></linearGradient>
        <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D255C"/><stop offset=".55" stop-color="#4A5698"/></linearGradient>
        <radialGradient id="gY"><stop offset="0" stop-color="#FFF4B0" stop-opacity=".95"/><stop offset=".45" stop-color="#FFE08A" stop-opacity=".45"/><stop offset="1" stop-color="#FFE08A" stop-opacity="0"/></radialGradient>
        <radialGradient id="gB"><stop offset="0" stop-color="#C8F0FF" stop-opacity=".9"/><stop offset=".5" stop-color="#9ADCFF" stop-opacity=".35"/><stop offset="1" stop-color="#9ADCFF" stop-opacity="0"/></radialGradient>
        <filter id="selF" x="-25%" y="-25%" width="150%" height="150%">
          <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d1"/>
          <feFlood flood-color="#FFFFFF"/><feComposite in2="d1" operator="in" result="o1"/>
          <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="d2"/>
          <feFlood flood-color="#FF8FB1"/><feComposite in2="d2" operator="in" result="o2"/>
          <feMerge><feMergeNode in="o2"/><feMergeNode in="o1"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="bg"></g>
      <g id="world" stroke="#5B4A55" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <g id="floorL"></g><g id="wallL"></g><g id="mainL"></g>
      </g>
      <g id="nightL"></g>
      <g id="lightL"></g>
      <g id="fxL" stroke="#5B4A55" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></g>
    </svg>
    <div id="toolbar">
      <button data-act="flip" title="转身">↔️</button>
      <button data-act="small" title="变小">➖</button>
      <button data-act="big" title="变大">➕</button>
      <button data-act="color" title="换颜色">🎨</button>
      <button data-act="undress" title="脱掉装扮">👕</button>
      <button data-act="del" title="拿走">🗑️</button>
    </div>
    <div id="hint">👇 把下面的东西拖进房间吧</div>
  </main>
  <footer id="tray"><div id="tabs"></div><div id="cards"></div></footer>
</div>
<div id="rotate" class="ask"><div class="ph">📱</div><div>把手机横过来玩更好哦</div><div style="font-size:14px;opacity:.6">（点一下继续）</div></div>

<script>
/* ================= 基础工具 ================= */
const SVGNS='http://www.w3.org/2000/svg';
const O='#5B4A55', NS='stroke="none"', FL=480;
const $=s=>document.querySelector(s);
const r1=v=>Math.round(v*10)/10, r3=v=>Math.round(v*1000)/1000;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>'x'+Math.random().toString(36).slice(2,9);
const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)};
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=p<0?0:255,a=Math.abs(p);
  r=Math.round((t-r)*a+r);g=Math.round((t-g)*a+g);b=Math.round((t-b)*a+b);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
const E=(cx,cy,rx,ry,f,e='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${e}/>`;
const C=(cx,cy,r,f,e='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${e}/>`;
const R=(x,y,w,h,rx,f,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${e}/>`;
const P=(d,f,e='')=>`<path d="${d}" fill="${f}" ${e}/>`;
const L=(d,w=4,c=O,e='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" ${e}/>`;
const tube=(d,c,w)=>L(d,w+8)+L(d,w,c);
const blob=(cs,f)=>cs.map(([x,y,r])=>C(x,y,r,O,'stroke-width="8"')).join('')+cs.map(([x,y,r])=>C(x,y,r,f,NS)).join('');
const heartD=(cx,cy,r)=>`M ${cx} ${cy+r*.9} C ${cx-r*1.7} ${cy-r*.1} ${cx-r*.9} ${cy-r*1.4} ${cx} ${cy-r*.45} C ${cx+r*.9} ${cy-r*1.4} ${cx+r*1.7} ${cy-r*.1} ${cx} ${cy+r*.9} Z`;
function starD(cx,cy,r){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.47:r;d+=(i?'L':'M')+r1(cx+Math.cos(a)*rr)+' '+r1(cy+Math.sin(a)*rr)+' ';}return d+'Z';}
function flower(x,y,r,c){let s='';for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;s+=C(r1(x+Math.cos(a)*r*.8),r1(y+Math.sin(a)*r*.8),r*.62,c,'stroke-width="2.5"');}return s+C(x,y,r*.5,'#FFE07A','stroke-width="2.5"');}
const cloudNS=(x,y,k,f='#fff')=>C(x-30*k,y,22*k,f,NS)+C(x,y-14*k,30*k,f,NS)+C(x+32*k,y,22*k,f,NS)+R(x-52*k,y-4*k,104*k,26*k,13*k,f,NS);

/* ================= 小动物 ================= */
const mw=y=>L(`M -8 ${y} Q -4 ${y+6} 0 ${y} Q 4 ${y+6} 8 ${y}`,3.5);
const AN={
  cat:{n:'小猫',v:880,box:[-62,-172,152,182],
    pals:[{b:'#FFC48C',l:'#FFF1DF',i:'#FFADBE',d:'#F09A58'},{b:'#D3D3DF',l:'#F7F7FB',i:'#FFADBE',d:'#A5A5BA'},{b:'#FFFFFF',l:'#FFF3F5',i:'#FFADBE',d:'#F2C49A'},{b:'#6E6878',l:'#9C95A8',i:'#FF9DB3',d:'#4E4957'}],
    back:p=>tube('M 26 -26 Q 72 -22 68 -62 Q 66 -86 84 -94',p.b,12)
      +P('M -50 -116 L -47 -168 L -12 -146 Z',p.b)+P('M 50 -116 L 47 -168 L 12 -146 Z',p.b)
      +P('M -43 -128 L -42 -156 L -24 -145 Z',p.i,NS)+P('M 43 -128 L 42 -156 L 24 -145 Z',p.i,NS),
    face:p=>L('M -10 -150 L -8 -139',5,p.d)+L('M 0 -152 L 0 -140',5,p.d)+L('M 10 -150 L 8 -139',5,p.d),
    mouth:()=>P('M -5 -94 L 5 -94 L 0 -89 Z','#FF8FA8','stroke-width="2.5"')+mw(-88)

function eyes(m,y,dx,white){

  let e='';
  for(const x of [-dx,dx]){
    if(white) e+=C(x,y,8.5,'#fff',NS);
    e+=E(x,y,white?5.5:7,white?6.5:8.5,O,NS)+C(x+2.5,y-3,white?2:2.6,'#fff',NS);
  }

}

const ROOMS=[
  {id:'bedroom',n:'卧室',ic:'🛏️',c:'#FFD1DC',wall:'#FDE6EE',floor:'#F0D2B0'},
  {id:'living',n:'客厅',ic:'🛋️',c:'#C9EEDB',wall:'#E4F5EC',floor:'#E2BC94'},
  {id:'kitchen',n:'厨房',ic:'🍰',c:'#FFEDB8',wall:'#FFF6DC',floor:'#FFFFFF'},
  {id:'bath',n:'浴室',ic:'🛁',c:'#CBE8F8',wall:'#E2F3FC',floor:'#F4FBFF'},
  {id:'play',n:'游乐场',ic:'🎠',c:'#D3F0C8',wall:'#BFE6FF',floor:'#A6DE8C'},
];
const INDOOR={
  bedroom:{pat:'pDots',wains:'#FAD5E1',rail:'#FFFFFF',plank:'#E3BE96'},
  living:{pat:'pStripe',plank:'#D3A97E'},
  kitchen:{wains:'#FFFFFF',wpat:'pTile',rail:'#FFE3A8',fpat:'pCheck'},
  bath:{pat:'pBub',wains:'#CFEAF8',wpat:'pBTile',rail:'#FFFFFF',fpat:'pBFloor'},
};
function planks(c){let s='',prev=FL+14;[FL+48,FL+108,FL+182,FL+270,FL+374].forEach((y,i)=>{
  for(let x=(i%2?120:330);x<1600;x+=420) s+=`<rect x="${x}" y="${prev}" width="4" height="${y-prev}" fill="${c}"/>`;
  s+=`<rect y="${y}" width="1600" height="4" fill="${c}"/>`;prev=y+4;});return s;}
function indoorBG(id){const o=INDOOR[id],rm=ROOMS.find(r=>r.id===id);
  return `<rect width="1600" height="${FL}" fill="${rm.wall}"/>`+(o.pat?`<rect width="1600" height="${FL}" fill="url(#${o.pat})"/>`:'')
    +(o.wains?`<rect y="${FL-140}" width="1600" height="140" fill="${o.wains}"/>`+(o.wpat?`<rect y="${FL-140}" width="1600" height="140" fill="url(#${o.wpat})"/>`:'')
      +`<rect y="${FL-148}" width="1600" height="14" rx="7" fill="${o.rail}"/>`:'')
    +`<rect y="${FL}" width="1600" height="${900-FL}" fill="${rm.floor}"/>`+(o.fpat?`<rect y="${FL}" width="1600" height="${900-FL}" fill="url(#${o.fpat})"/>`:planks(o.plank))
    +`<rect y="${FL-10}" width="1600" height="24" fill="#FFFFFF"/><rect y="${FL+14}" width="1600" height="8" fill="rgba(91,74,85,.07)"/>`;}
function playBG(n){
  let s=`<rect width="1600" height="900" fill="url(#${n?'skyN':'sky'})"/>`;
  if(n){
    s+=[[120,80],[300,150],[520,60],[700,130],[900,70],[1100,150],[1250,60],[240,260],[640,240],[1000,250],[1520,240],[820,190]]
      .map(([x,y],i)=>`<path d="${starD(x,y,6+i%3*2)}" fill="#FFF6C8" class="twinkle" style="animation-delay:${(i*.37).toFixed(2)}s"/>`).join('');
    s+=C(1400,130,52,'#FFF4C2')+C(1426,112,48,'#1F275E');
  }else{
    let rays='';for(let i=0;i<12;i++) rays+=`<rect x="-6" y="-98" width="12" height="28" rx="6" fill="#FFD25E" transform="rotate(${i*30})"/>`;
    s+=`<g transform="translate(1410 140)"><g class="spin">${rays}</g>${C(0,0,58,'#FFE27A','stroke="#F5B942" stroke-width="5"')}`
      +`${C(-18,-6,5,O)}${C(18,-6,5,O)}${E(-30,10,8,5,'#FF9DB0','opacity=".7"')}${E(30,10,8,5,'#FF9DB0','opacity=".7"')}`

const def=it=>it.k==='a'?null:TH[it.t];
const depth=it=>{const d=def(it);if(d&&d.wall)return 1;return clamp(.8+(it.y-560)*.00078,.68,1.1);};
function clampY(it,y){const d=def(it);if(d&&d.wall)return clamp(y,70,FL-40);if(d&&d.floor)return clamp(y,FL+50,870);return clamp(y,FL+20,895);}

/* ================= 绘制 ================= */
function artOf(it,opt={}){
  if(it.k==='a') return {b:animalArt(it.t,it.c,{eyes:opt.eyes,acc:it.acc,seated:opt.seated})};
  const d=TH[it.t],col=d.colors[it.c%d.colors.length];
  let r=d.art(col,it,{night:state.night});if(typeof r==='string')r={b:r};
  if(!d.wall&&!d.floor&&!opt.seated){const w=r1(d.box[2]*.4);r.b=E(0,0,w,Math.max(8,r1(w*.12)),'rgba(91,74,85,.1)',NS)+r.b;}
  return r;
}
function part(it,x,y,S,content){
  const cls=it.id===justAdded?'pop appear':'pop';
  const inner=it.k==='a'?`<g class="idle" style="animation-delay:-${(hash(it.id)%28)/10}s">${content}</g>`:content;
  return `<g data-id="${it.id}" transform="translate(${r1(x)} ${r1(y)}) scale(${r3(S*(it.f?-1:1))} ${r3(S)})"><g class="${cls}">${inner}</g></g>`;
}
const EYES={sleep:'closed',swing:'happy',slide:'happy',bounce:'happy',bath:'happy',pit:'happy',eat:'happy'};
function cluster(it){
  const d=def(it),S=it.s*depth(it),fl=it.f?-1:1;
  layout[it.id]={x:it.x,y:it.y,S};
  const a=artOf(it);
  let s=part(it,it.x,it.y,S,a.b);
  if(d&&d.seats){
    let inner=a.m?part(it,it.x,it.y,S,a.m):'',outer='';
    for(const o of items().filter(o=>o.h===it.id)){
      const st=d.seats[o.si];if(!st)continue;
      const wx=it.x+st.x*S*fl,wy=it.y+st.y*S,oS=o.s*depth(it);
      layout[o.id]={x:wx,y:wy,S:oS,m:st.m};
      let h=part(o,wx,wy,oS,artOf(o,{eyes:EYES[st.m],seated:true}).b);
      if(st.m==='sleep'&&o.k==='a') h+=`<g class="zzz" transform="translate(${r1(wx+30*oS)} ${r1(wy-175*oS)}) scale(${r3(oS)})" pointer-events="none">`
        +['z1','z2','z3'].map(z=>`<text class="${z}" font-size="34" font-weight="900" fill="#8FA2FF" stroke="#fff" stroke-width="5" paint-order="stroke">Z</text>`).join('')+'</g>';
      const org=`transform-origin:${r1(wx)}px ${r1(wy)}px`;
      if(st.m==='swing') inner+=h;
      else if(st.m==='slide') outer+=`<g class="m-slide" style="--dx:${r1(st.dx*S*fl)}px;--dy:${r1(st.dy*S)}px;--ex:${r1(st.ex*S*fl)}px;--ey:${r1(st.ey*S)}px">${h}</g>`;
      else if(st.m==='bounce') outer+=`<g class="m-bounce" style="${org};--h:${r1(-150*S)}px">${h}</g>`;
      else if(st.m==='bath'||st.m==='pit') outer+=`<g class="m-bob" style="${org};animation-delay:-${o.si*.9}s">${h}</g>`;
      else if(st.m==='eat') outer+=`<g class="m-nod" style="${org}">${h}</g>`;
      else outer+=h;
    }
    if(d.pivot){const px=it.x+d.pivot[0]*S*fl,py=it.y+d.pivot[1]*S;s+=`<g class="m-swing" style="transform-origin:${r1(px)}px ${r1(py)}px">${inner}</g>`;}
    else s+=inner;
    s+=outer;
  }
  if(a.f) s+=part(it,it.x,it.y,S,a.f);
  return `<g data-cluster="${it.id}">${s}</g>`;
}
function render(){

function svgPt(e){const p=stage.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(stage.getScreenCTM().inverse());}
function newItem(cat,key,x,y){
  if(cat==='animal') return A(key,x,y,{c:0});
  return T(key,x,y,{});
}
function addByTap(cat,key){
  const it=newItem(cat,key,0,0),d=def(it);
  if(d&&d.wall){it.x=250+Math.random()*1100;it.y=150+Math.random()*170;}
  else if(d&&d.floor){it.x=300+Math.random()*1000;it.y=700+Math.random()*120;}
  else{it.x=260+Math.random()*1080;it.y=640+Math.random()*200;}
  items().push(it);justAdded=it.id;sel=it.id;if(it.k==='a')lastAnimal=it.id;
  save();render();sfx.pop();
  const L=layout[it.id];if(L)fx(L.x,L.y-60*L.S,'star',6);
}
function applyAcc(a,key){
  const slot=ACC[key].slot;a.acc=a.acc||{};
  if(a.acc[slot]===key)delete a.acc[slot];else a.acc[slot]=key;
  sel=a.id;lastAnimal=a.id;save();render();anim(a.id,'jump');sfx.sparkle();
  const L=layout[a.id];if(L)fx(L.x,L.y-150*L.S,'star',7);
}
function animalAt(p){
  let best=null,bd=1e9;
  for(const it of items()){if(it.k!=='a')continue;const L=layout[it.id];if(!L)continue;
    const cx=L.x,cy=L.y-104*L.S,dist=Math.hypot(p.x-cx,p.y-cy);
    const inBody=Math.abs(p.x-cx)<70*L.S&&p.y>L.y-175*L.S&&p.y<L.y+10;
    if((dist<85*L.S||inBody)&&dist<bd){bd=dist;best=it;}}
  return best;
}
function seatPos(h,i){const d=def(h),S=h.s*depth(h),st=d.seats[i];return {x:h.x+st.x*S*(h.f?-1:1),y:h.y+st.y*S,S};}
function findSeat(it,x,y){
  if(!canSeat(it))return null;let best=null,bd=1e9;
  for(const h of items()){const d=def(h);if(!d||!d.seats||h===it)continue;
    const S=h.s*depth(h),b=d.box,hx=Math.abs(x-h.x),inside=hx<(b[2]/2)*S&&y>h.y+b[1]*S*.8&&y<h.y+30;
    d.seats.forEach((st,i)=>{if(items().some(o=>o.h===h.id&&o.si===i&&o!==it))return;
      const p=seatPos(h,i),dist=Math.hypot(p.x-x,p.y-y);
      if((dist<115*p.S||inside)&&dist<bd){bd=dist;best={h,i,p};}});}
  return best;
}
function anim(id,cls){

    el.classList.remove('appear','jump','wiggle','hop');void el.getBoundingClientRect();el.classList.add(cls);
    setTimeout(()=>el.classList.remove(cls),700);});
}
function tap(it){
  sel=it.id;markSel();placeToolbar();

  if(d.tap==='toggle'){it.o=!it.o;save();render();sfx.click();if(it.o)fx(L.x,L.y-200*L.S,'star',5);return;}

  if(d.tap==='hop'){anim(it.id,'jump');sfx.boing();return;}
  anim(it.id,'wiggle');sfx.pop();
}

function beginMove(){

function moveTo(p){

}
let hintEl=null;

}
function startTrayDrag(e){

    const g=document.createElementNS(SVGNS,'g');g.innerHTML=`<g>${ACC[t.key].art(20)}</g>`;fxL.appendChild(g);
    drag={acc:t.key,pid:t.pid,moved:true,ghost:g};moveGhost(p);return;

}
function moveGhost(p){drag.ghost.setAttribute('transform',`translate(${r1(p.x)} ${r1(p.y-50)}) scale(1.6)`);
  const a=animalAt(p);if(a!==drag.over){drag.over=a;sel=a?a.id:null;markSel();}}
window.addEventListener('pointermove',e=>{
  if(trayDrag&&!drag&&e.pointerId===trayDrag.pid){
    const dx=e.clientX-trayDrag.sx,dy=e.clientY-trayDrag.sy;
    // 道具栏在下面时往上拖、在右边时往左拖才算拖出来；另一个方向是滑动翻页
    const side=RAIL.matches,along=side?dy:dx,out=side?-dx:-dy;
    if(trayDrag.pt!=='mouse'&&Math.abs(along)>12&&Math.abs(along)>Math.abs(out)){trayDrag.el.classList.remove('press');trayDrag=null;return;}
    const go=trayDrag.pt==='mouse'?Math.hypot(dx,dy)>8:(out>10&&out>Math.abs(along));
    if(go)startTrayDrag(e);
    return;
  }
  if(!drag||e.pointerId!==drag.pid)return;
  const p=svgPt(e);
  if(drag.acc){moveGhost(p);return;}
  if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7)return;beginMove();}
  moveTo(p);
});
function endPointer(e,cancel){
  if(trayDrag&&!drag&&e.pointerId===trayDrag.pid){
    const t=trayDrag;trayDrag=null;t.el.classList.remove('press');
    if(!cancel){hideHint();if(t.cat==='dress'){const target=(getItem(sel)&&getItem(sel).k==='a'&&getItem(sel))||getItem(lastAnimal)||items().find(i=>i.k==='a');
      if(target)applyAcc(target,t.key);else sfx.poof();}else addByTap(t.cat,t.key);}
    return;
  }
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;showSeatHint(null);
  if(d.acc){d.ghost.remove();const a=cancel?null:animalAt(svgPt(e));if(a)applyAcc(a,d.acc);else{sel=null;markSel();sfx.poof();}return;}
  if(!d.moved){if(!cancel)tap(d.it);return;}
  const it=d.it,s=findSeat(it,it.x,it.y);
  if(s){it.h=s.h.id;it.si=s.i;sfx.snap();}else sfx.drop();
  if(it.k==='a')lastAnimal=it.id;
  save();render();
  const L=layout[it.id];if(L&&s)fx(L.x,L.y-80*L.S,'star',6);
}
window.addEventListener('pointerup',e=>endPointer(e,false));
window.addEventListener('pointercancel',e=>endPointer(e,true));
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= 选中工具条 ================= */
function boxOf(it){return it.k==='a'?(AN[it.t].box||[-62,-172,124,182]):TH[it.t].box;}
function placeToolbar(){
  const tb=$('#toolbar'),it=getItem(sel);
  if(!it||drag||!layout[it.id]){tb.classList.remove('show');return;}
  const pals=it.k==='a'?AN[it.t].pals.length:TH[it.t].colors.length;
  tb.querySelector('[data-act=color]').style.display=pals>1?'':'none';
  tb.querySelector('[data-act=undress]').style.display=it.k==='a'&&Object.keys(it.acc||{}).length?'':'none';
  const wasShown=tb.classList.contains('show');tb.classList.add('show');
  if(!wasShown){tb.style.animation='none';void tb.offsetWidth;tb.style.animation='';}
  const L=layout[it.id],b=boxOf(it),m=stage.getScreenCTM(),wr=$('#stageWrap').getBoundingClientRect();
  const xs=[L.x+b[0]*L.S*(it.f?-1:1),L.x+(b[0]+b[2])*L.S*(it.f?-1:1)];
  const sl=m.a*Math.min(...xs)+m.e,sr=m.a*Math.max(...xs)+m.e,st=m.d*(L.y+b[1]*L.S)+m.f,sb=m.d*(L.y+(b[1]+b[3])*L.S)+m.f;
  const w=tb.offsetWidth,h=tb.offsetHeight;
  let top=st-wr.top-h-10;if(top<6)top=sb-wr.top+10;
  tb.style.left=clamp((sl+sr)/2-wr.left-w/2,6,wr.width-w-6)+'px';
  tb.style.top=clamp(top,6,wr.height-h-6)+'px';
}
$('#toolbar').addEventListener('click',e=>{
  const b=e.target.closest('button'),it=getItem(sel);if(!b||!it)return;
  const act=b.dataset.act,L=layout[it.id];
  if(act==='flip'){it.f=!it.f;sfx.pick();}
  if(act==='big'){it.s=r3(Math.min(1.8,it.s+.15));sfx.pop();}
  if(act==='small'){it.s=r3(Math.max(.5,it.s-.15));sfx.pop();}
  if(act==='color'){const n=it.k==='a'?AN[it.t].pals.length:TH[it.t].colors.length;it.c=(it.c+1)%n;sfx.sparkle();}
  if(act==='undress'){it.acc={};sfx.pick();}
  if(act==='del'){
    for(const o of items()){if(o.h===it.id){const l=layout[o.id];o.h=null;o.si=null;o.x=clamp(l.x,40,1560);o.y=clampY(o,l.y+60);}}
    state.rooms[state.room]=items().filter(o=>o!==it);sel=null;sfx.poof();if(L)fx(L.x,L.y-60*L.S,'dot',10);
  }
  save();render();
  if(act==='color'&&L)fx(L.x,L.y-80*L.S,'star',5);
});
new ResizeObserver(()=>{placeToolbar();paintWrap();}).observe($('#stageWrap'));

/* ================= 顶部按钮 ================= */
$('#bNight').onclick=()=>{state.night=!state.night;save();render();state.night?tone(392,.4,{to:262,vol:.12}):sfx.room();};
$('#bSound').onclick=()=>{state.sound=!state.sound;save();render();sfx.click();};
$('#bReset').onclick=()=>{if(!confirm('要把「'+ROOMS.find(r=>r.id===state.room).n+'」恢复成一开始的样子吗？'))return;
  state.rooms[state.room]=presets()[state.room];sel=null;save();render();sfx.room();};
const fsOK=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
if(!fsOK)$('#bFull').style.display='none';
$('#bFull').onclick=()=>{
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
  const el=document.documentElement;const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});
};
$('#rotate').onclick=()=>$('#rotate').classList.remove('ask');
function hideHint(){if(!state.hinted){state.hinted=true;save();}$('#hint').style.display='none';}
if(state.hinted)$('#hint').style.display='none';

/* ================= 特效 ================= */
const FXC=['#FF8FB1','#FFD166','#7AC7F0','#8FD694','#C3A6FF'];
function fx(x,y,kind,n=5){
  let s='';
  for(let i=0;i<n;i++){
    const dx=r1((Math.random()-.5)*(kind==='confetti'?260:140)),dy=r1(-50-Math.random()*(kind==='confetti'?160:90)),r=7+Math.random()*7;
    const col=kind==='heart'?['#FF6F91','#FF8FB1','#FFB5C8'][i%3]:FXC[i%5];
    const shape=kind==='heart'?P(heartD(0,0,r),col,'stroke-width="2.5"'):kind==='star'?P(starD(0,0,r),col,'stroke-width="2.5"')
      :kind==='confetti'?R(-5,-3,10,6,2,col,NS+` transform="rotate(${Math.round(Math.random()*180)})"`):C(0,0,r*.7,'#fff','stroke-width="3"');
    s+=`<g transform="translate(${r1(x)} ${r1(y)})"><g class="fxp" style="--dx:${dx}px;--dy:${dy}px;animation-delay:${i*35}ms">${shape}</g></g>`;
  }
  const g=document.createElementNS(SVGNS,'g');g.innerHTML=s;fxL.appendChild(g);setTimeout(()=>g.remove(),1500);
}
function emote(it){
  const L=layout[it.id];if(!L)return;
  const ic=L.m==='sleep'?'💤':L.m==='eat'?'😋':L.m?['🎵','✨','💕'][Math.random()*3|0]:['💕','🎵','✨','⭐','🌸'][Math.random()*5|0];
  const g=document.createElementNS(SVGNS,'g');
  g.innerHTML=`<g transform="translate(${r1(L.x+40*L.S)} ${r1(L.y-190*L.S)})"><g class="emote">${C(0,-14,26,'#fff','stroke-width="3"')}<text y="-2" font-size="30" text-anchor="middle" stroke="none">${ic}</text></g></g>`;
  fxL.appendChild(g);setTimeout(()=>g.remove(),2000);
}
setInterval(()=>{
  if(drag||document.hidden)return;
  const as=items().filter(i=>i.k==='a');if(!as.length)return;
  const it=as[Math.random()*as.length|0];
  emote(it);
  if(!it.h&&Math.random()<.5&&it.id!==sel){anim(it.id,'hop');}
},2600);

/* ================= 声音 ================= */
let AC=null;
function unlock(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,{type='sine',vol=.15,to=null,delay=0}={}){
  if(!state.sound||!AC)return;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05);
}
const sfx={
  pop:()=>tone(520,.12,{to:900,vol:.16}),
  pick:()=>tone(660,.08,{to:820,vol:.1,type:'triangle'}),
  drop:()=>tone(420,.12,{to:250,vol:.16,type:'triangle'}),
  snap:()=>{tone(523,.1,{vol:.14,type:'triangle'});tone(784,.16,{vol:.14,type:'triangle',delay:.08});},
  sparkle:()=>[1047,1319,1568,2093].forEach((f,i)=>tone(f,.18,{vol:.07,type:'triangle',delay:i*.06})),
  voice:f=>{tone(f,.14,{to:f*1.35,vol:.12});tone(f*1.2,.16,{to:f*.9,vol:.1,delay:.12});},
  click:()=>tone(1200,.05,{vol:.08,type:'square'}),
  poof:()=>tone(360,.2,{to:110,vol:.14,type:'triangle'}),
  boing:()=>tone(200,.32,{to:520,vol:.14}),
  room:()=>[523,659,784].forEach((f,i)=>tone(f,.16,{vol:.1,type:'triangle',delay:i*.07})),
};

/* ================= 开始 ================= */
RAIL.addEventListener('change',()=>renderTray());
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
renderRooms();renderTray();render();
</script>
